<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienvenido | Acceso Sistema</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: radial-gradient(circle at center, #1e272e 0%, #050505 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
            color: white;
        }
        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.05);
            padding: 60px;
            border-radius: 20px;
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            animation: fadeIn 1.2s ease-out;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        h1 { font-size: 3rem; margin-bottom: 10px; letter-spacing: 2px; text-transform: uppercase; }
        p { color: #888; margin-bottom: 40px; font-size: 1.1rem; }
        .btn-discord {
            background: #5865F2;
            color: white;
            padding: 18px 45px;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 800;
            font-size: 1.2rem;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 0 20px rgba(88, 101, 242, 0.4);
        }
        .btn-discord:hover {
            transform: scale(1.05);
            background: #4752c4;
            box-shadow: 0 0 35px rgba(88, 101, 242, 0.6);
        }
        /* Decoración */
        .circle { position: absolute; border-radius: 50%; background: rgba(88, 101, 242, 0.1); z-index: -1; filter: blur(60px); }
        .c1 { width: 400px; height: 400px; top: -100px; left: -100px; }
        .c2 { width: 300px; height: 300px; bottom: -50px; right: -50px; background: rgba(233, 30, 99, 0.05); }
    </style>
</head>
<body>
    <div class="circle c1"></div>
    <div class="circle c2"></div>
    <div class="container">
        <h1>SISTEMA DE GESTIÓN</h1>
        <p>Autentícate con tu cuenta institucional de Discord para continuar.</p>
        <a href="/auth/discord" class="btn-discord">
            <span>INGRESAR CON DISCORD</span>
        </a>
    </div>
</body>
</html>
