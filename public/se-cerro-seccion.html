<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Tu sesión en Medellín RP se cerró por inactividad."
    />
    <title>Sesión cerrada | Medellín RP</title>
    <style>
      :root {
        --bg: #0a0a0a;
        --panel: rgba(20, 20, 20, 0.72);
        --line: rgba(255, 255, 255, 0.1);
        --text: #ffffff;
        --muted: #a1a1a1;
        --shadow: 0 30px 100px rgba(0, 0, 0, 0.6);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        min-height: 100vh;
        color: var(--text);
        background: var(--bg);
        font-family:
          "Inter",
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        overflow-x: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      /* Fondo animado sutil en blanco y negro (igual que el login) */
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: -2;
        background:
          radial-gradient(circle at 30% 20%, rgba(255, 255, 255, 0.06), transparent 40%),
          radial-gradient(circle at 80% 80%, rgba(255, 255, 255, 0.04), transparent 40%);
        background-size: 200% 200%;
        animation: fondoMover 20s ease infinite;
      }

      @keyframes fondoMover {
        0%, 100% { background-position: 0% 0%; }
        50% { background-position: 100% 100%; }
      }

      @keyframes aparecer {
        from { opacity: 0; transform: translateY(24px); }
        to { opacity: 1; transform: translateY(0); }
      }

      @keyframes flotar {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-10px); }
      }

      @keyframes brilloTexto {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.6; }
      }

      .shell {
        width: min(560px, 92%);
        border: 1px solid var(--line);
        border-radius: 24px;
        background: var(--panel);
        box-shadow: var(--shadow);
        backdrop-filter: blur(20px);
        overflow: hidden;
        animation: aparecer 1s ease both;
      }

      .top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 15px;
        padding: 22px clamp(22px, 4vw, 36px);
        border-bottom: 1px solid var(--line);
      }

      .brand {
        font-weight: 850;
        font-size: 15px;
        letter-spacing: -0.02em;
      }

      .brand small {
        display: block;
        margin-top: 4px;
        color: var(--muted);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .content {
        padding: clamp(26px, 5vw, 44px);
        text-align: center;
      }

      .hero-icon {
        display: grid;
        width: 76px;
        height: 76px;
        margin: 0 auto 22px;
        place-items: center;
        border-radius: 22px;
        border: 1px solid var(--line);
        background: #111;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4), 0 0 22px rgba(255, 255, 255, 0.18);
        animation: flotar 4s ease-in-out infinite;
      }

      .hero-icon svg {
        width: 34px;
        height: 34px;
        stroke: #fff;
        stroke-width: 2.2;
        fill: none;
        filter: grayscale(100%) drop-shadow(0 0 6px rgba(255, 255, 255, 0.8));
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: var(--muted);
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        margin-bottom: 10px;
      }

      .eyebrow::before,
      .eyebrow::after {
        content: "";
        width: 26px;
        height: 1px;
        background: var(--muted);
      }

      h1 {
        margin: 0 0 14px;
        font-size: clamp(26px, 5vw, 38px);
        font-weight: 900;
        letter-spacing: -0.05em;
        text-shadow: 0 0 10px rgba(255, 255, 255, 0.25);
        animation: aparecer 1.1s ease both;
      }

      .intro {
        max-width: 430px;
        margin: 0 auto;
        color: var(--muted);
        font-size: 15px;
        line-height: 1.65;
        animation: aparecer 1.2s ease both;
      }

      .actions {
        display: flex;
        justify-content: center;
        margin-top: 30px;
        animation: aparecer 1.3s ease both;
      }

      /* Mismo botón del login */
      .button {
        min-height: 52px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 14px;
        padding: 0 26px;
        color: #fff;
        background: rgba(255, 255, 255, 0.05);
        font-size: 15px;
        font-weight: 700;
        font-family: inherit;
        cursor: pointer;
        text-decoration: none;
        transition: all 0.3s ease;
      }

      .button:hover,
      .button:focus {
        border-color: rgba(255, 255, 255, 0.4);
        background: rgba(255, 255, 255, 0.12);
        transform: translateY(-2px);
        box-shadow: 0 12px 30px rgba(255, 255, 255, 0.1);
      }

      @media (max-width: 600px) {
        .top {
          align-items: flex-start;
          flex-direction: column;
        }

        .actions {
          flex-direction: column;
          align-items: stretch;
        }

        .button {
          width: 100%;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <div class="top">
        <div class="brand">
          「ME:RP」Medellín RP︱ER:LC
          <small>Sesión finalizada</small>
        </div>
      </div>
      <div class="content">
        <div class="hero-icon">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="5" y="11" width="14" height="10" rx="2" />
            <path d="M8 11V7a4 4 0 0 1 8 0v4" />
          </svg>
        </div>
        <div class="eyebrow">「ME:RP」Medellín RP︱ER:LC</div>
        <h1>Sesión cerrada automáticamente</h1>
        <p class="intro">
          Tu sesión se cerró después de 5 minutos de inactividad para proteger
          tu cuenta y los datos registrados.
        </p>
        <div class="actions">
          <a class="button" href="/index.html">Volver a iniciar sesión</a>
        </div>
      </div>
    </main>
  </body>
</html>
