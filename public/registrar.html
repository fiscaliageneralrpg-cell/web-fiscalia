<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>DevHub | Crear ID</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        /* CSS REUTILIZADO Y EXTENDIDO PARA REGISTRO */
        :root {
            --bg-color: #ffffff;
            --apple-blue: #0071e3;
            --apple-red: #ff3b30;
        }

        body {
            background-color: var(--bg-color);
            margin: 0; font-family: 'Inter', sans-serif;
            display: flex; justify-content: center; align-items: center;
            height: 100vh;
        }

        .container { width: 100%; max-width: 480px; padding: 40px; text-align: center; }

        h1 { font-size: 40px; font-weight: 700; color: #1d1d1f; margin-bottom: 10px; letter-spacing: -1px; }
        p { color: #86868b; font-size: 19px; margin-bottom: 40px; }

        .input-stack { margin-bottom: 25px; }
        
        input {
            width: 100%;
            padding: 18px;
            font-size: 17px;
            border-radius: 12px;
            border: 1px solid #d2d2d7;
            margin-bottom: 12px;
            outline: none;
            transition: border-color 0.3s;
        }

        input:focus { border-color: var(--apple-blue); }

        .btn-black {
            width: 100%;
            padding: 18px;
            background: #000;
            color: white;
            border-radius: 12px;
            font-size: 17px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn-black:hover { opacity: 0.85; }

        .alert-error {
            color: var(--apple-red);
            font-size: 14px;
            margin-bottom: 20px;
            display: none;
            background: #fff2f2;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid rgba(255, 59, 48, 0.2);
        }

        .footer { margin-top: 30px; font-size: 14px; color: #86868b; }
        .footer a { color: var(--apple-blue); text-decoration: none; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Crear tu ID</h1>
        <p>Solo un paso para unirte.</p>

        <div id="errorMsg" class="alert-error"></div>

        <form id="regForm">
            <div class="input-stack">
                <input type="text" id="rUser" placeholder="Nombre de usuario" required>
                <input type="email" id="rEmail" placeholder="Correo electrónico" required>
                <input type="password" id="rPass" placeholder="Contraseña (mín. 7 caracteres)" required>
            </div>
            
            <button type="submit" class="btn-black">Crear cuenta</button>
        </form>

        <div class="footer">
            ¿Ya tienes cuenta? <a href="/">Inicia sesión</a>
        </div>
    </div>

    <script>
        const form = document.getElementById('regForm');
        const errorBox = document.getElementById('errorMsg');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorBox.style.display = "none";

            const pass = document.getElementById('rPass').value;
            const username = document.getElementById('rUser').value;
            const email = document.getElementById('rEmail').value;

            // VALIDACIÓN DE FRONTEND: 7 CARACTERES
            if (pass.length < 7) {
                errorBox.innerText = "✕ LA CONTRASEÑA ES MUY CORTA: Debe tener al menos 7 caracteres para ser segura.";
                errorBox.style.display = "block";
                return;
            }

            try {
                const res = await fetch('/api/registrar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email, password: pass })
                });

                const data = await res.json();

                if (res.status === 201) {
                    alert("¡Cuenta creada con éxito! Ahora puedes entrar.");
                    window.location.href = "/";
                } else {
                    errorBox.innerText = "✕ " + data.message;
                    errorBox.style.display = "block";
                }
            } catch (err) {
                errorBox.innerText = "✕ ERROR DE CONEXIÓN: No se detectó la base de datos de Render.";
                errorBox.style.display = "block";
            }
        });
    </script>
</body>
</html>
