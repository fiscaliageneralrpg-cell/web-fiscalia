<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Buscar publicaciones · Medellín RP</title>
<link rel="icon" type="image/png" sizes="192x192" href="/favicon.png">
<style>
/* Tema Medellín RP (igual al login) — sirve para twitter.html, twitter-perfil.html y twitter-buscar.html */
:root{
  --bg:#0a0a0a;--panel:rgba(20,20,20,.72);--panel2:rgba(255,255,255,.05);
  --line:rgba(255,255,255,.10);--line2:rgba(255,255,255,.18);
  --text:#fff;--muted:#a1a1a1;--accent:#d4d4d4;--cyan:#74e6ff;--gold:#fff;
  --danger:#ef7777;--red:#ef7777;--ink:#fff;--shadow:0 30px 100px rgba(0,0,0,.6)
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;color:var(--text);background:var(--bg);font-family:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-2;background:radial-gradient(circle at 30% 20%,rgba(255,255,255,.06),transparent 40%),radial-gradient(circle at 80% 80%,rgba(255,255,255,.04),transparent 40%);background-size:200% 200%;animation:fondoMover 20s ease infinite}
a{color:inherit}
@keyframes fondoMover{0%,100%{background-position:0 0}50%{background-position:100% 100%}}
@keyframes appear{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes enter{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes searchIn{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}

/* ===== Layout ===== */
.page{width:min(1420px,calc(100% - 32px));margin:0 auto;padding:22px 0 60px;animation:enter .8s ease both}
.page:has(>.top){width:min(900px,calc(100% - 28px))}
.topbar,.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 0 20px;color:var(--muted);font-size:13px}
.top{margin-bottom:0}
.topbar a,.top a{color:var(--muted);text-decoration:none;font-weight:700;transition:color .2s}
.topbar a:hover,.top a:hover{color:#fff}
.brand,.top strong{color:#fff;font-weight:900;letter-spacing:-.01em}
.brand::after,.top strong::after{content:" ❄️"}
.app{display:grid;grid-template-columns:230px minmax(420px,680px) 280px;gap:18px;align-items:start}

/* ===== Paneles de vidrio ===== */
.side,.right,.feed,.onboarding,.box,.profile,.posts{
  border:1px solid var(--line);border-radius:22px;background:var(--panel);
  box-shadow:0 22px 60px rgba(0,0,0,.4);backdrop-filter:blur(20px)
}
.side,.right{padding:18px;position:sticky;top:18px}
.feed{min-width:0;overflow:hidden}
.posts{margin-top:16px;overflow:hidden}
.profile-posts{padding:0}

/* ===== Lateral ===== */
.profile-mini{display:flex;align-items:center;gap:11px;padding-bottom:18px;border-bottom:1px solid var(--line)}
.profile-mini b{display:block;font-size:14px}
.profile-mini small{color:var(--muted);font-size:11px}
.avatar{width:45px;height:45px;border-radius:50%;object-fit:cover;border:2px solid var(--line2);background:#111;transition:transform .18s,border-color .18s}
.author .avatar,.author img{width:44px;height:44px}
.profile-row .avatar,.profile .avatar{width:78px;height:78px;border:3px solid rgba(255,255,255,.35)}
.welcome .avatar{width:68px;height:68px}
.nav{display:grid;gap:8px;margin-top:18px}
.nav button{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid transparent;border-radius:14px;color:var(--accent);background:transparent;text-align:left;font:inherit;font-weight:700;cursor:pointer;transition:all .3s ease}
.nav button:hover{border-color:rgba(255,255,255,.4);color:#fff;background:rgba(255,255,255,.12);transform:translateX(3px)}
.nav button.active{border-color:#fff;color:#0a0a0a;background:#fff}
.side-note{margin-top:24px;color:#777;font-size:11px;line-height:1.5}

/* ===== Cabecera del feed ===== */
.feed-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 20px;border-bottom:1px solid var(--line);background:linear-gradient(120deg,rgba(255,255,255,.08),rgba(0,0,0,.25))}
.feed-head h1{margin:0;font-size:23px;letter-spacing:-.04em}
.feed-head p{margin:4px 0 0;color:var(--muted);font-size:12px}
.head{position:relative;overflow:hidden;padding:24px;border-bottom:1px solid var(--line);background:linear-gradient(135deg,rgba(0,0,0,.55),rgba(255,255,255,.05))}
.head::after{content:"✦";position:absolute;right:28px;top:15px;font-size:70px;color:rgba(255,255,255,.07);transform:rotate(18deg)}
.head h1,h1{margin:0;letter-spacing:-.04em}
.head h1{font-size:28px}
.head p{margin:7px 0 0;color:#b3b3b3}
.query{display:inline-block;margin-top:15px;padding:8px 14px;border:1px solid rgba(116,230,255,.35);border-radius:999px;color:var(--cyan);background:rgba(76,164,255,.12);font-weight:800}

/* ===== Campos ===== */
input,textarea{width:100%;padding:12px 13px;border:1px solid var(--line2);border-radius:12px;color:#fff;background:rgba(0,0,0,.35);font:inherit;transition:border-color .2s,background .2s}
input:focus,textarea:focus{outline:none;border-color:rgba(255,255,255,.5);background:rgba(0,0,0,.5);box-shadow:0 0 0 3px rgba(255,255,255,.06)}
input::placeholder,textarea::placeholder{color:#777}
.search{width:min(260px,42%);border-radius:999px}
.compose{display:flex;gap:12px;padding:18px 20px;border-bottom:1px solid var(--line)}
.compose textarea{flex:1;min-height:48px;max-height:120px;resize:vertical}
.settings-form,.onboarding form{display:grid;gap:10px}
.settings-form label,.onboarding label{display:grid;gap:6px;color:var(--accent);font-size:12px;font-weight:700}
.hint,.file-note{color:var(--muted);font-size:11px;line-height:1.5}
.comment-form{display:flex;gap:8px;margin-top:12px}
.comment-form input{flex:1;min-width:0;padding:10px 12px;border-radius:10px}

/* ===== Botones ===== */
.btn,.comment-form button,.follow-btn{border:1px solid #fff;border-radius:12px;padding:10px 15px;color:#0a0a0a;background:#fff;font-weight:800;cursor:pointer;transition:all .3s ease}
.btn:hover,.comment-form button:hover,.follow-btn:hover{transform:translateY(-2px);background:#e5e5e5;box-shadow:0 12px 30px rgba(255,255,255,.15)}
.btn:active{transform:scale(.97)}
.btn.secondary,.follow-btn.following{color:#fff;background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.15)}
.btn.secondary:hover,.follow-btn.following:hover{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.4);box-shadow:none}
.btn.gold{color:#0a0a0a;background:#fff}
.btn.danger{color:#ffb5b5;background:rgba(239,68,68,.18);border-color:rgba(239,68,68,.5)}
.btn:disabled,.pager button:disabled{opacity:.4;cursor:not-allowed;transform:none}
.follow-btn{margin-top:15px}
.back,.back-search,.back-profile{display:inline-flex;align-items:center;gap:7px;margin:0 0 16px;padding:10px 14px;border:1px solid rgba(255,255,255,.15);border-radius:12px;color:#fff;background:rgba(255,255,255,.05);text-decoration:none;font-weight:700;font-size:12px;transition:all .3s ease}
.back:hover,.back-search:hover,.back-profile:hover{border-color:rgba(255,255,255,.4);background:rgba(255,255,255,.12);transform:translateY(-2px)}
.back-profile{margin:18px 20px 0}

/* ===== Publicaciones ===== */
.post,.result{position:relative;padding:20px;border-bottom:1px solid var(--line);background:transparent;cursor:pointer;animation:appear .3s ease both;transition:transform .2s,background .2s,border-color .2s}
.post:hover,.result:hover{background:rgba(255,255,255,.04);transform:translateY(-2px)}
.result:hover{border-left:3px solid #fff}
.post-top,.author{display:flex;gap:11px;align-items:center;cursor:default}
.post-top strong,.author b{display:block}
.post-top small,.author small{color:var(--muted);font-size:11px}
.post-title,.title{margin:15px 0 6px;font-size:18px}
.post-description,.desc{margin:0;color:#c9c9c9;white-space:pre-wrap;line-height:1.55;font-size:14px}
.post-image,.photo{display:block;max-width:100%;width:100%;max-height:430px;margin:15px 0 0;object-fit:cover;border-radius:16px;border:1px solid var(--line)}
.post-actions,.actions{display:flex;align-items:center;gap:10px;margin-top:15px;cursor:default;color:var(--muted);font-size:12px;font-weight:700}
.post-actions button,.actions button,.like{padding:8px 12px;border:1px solid var(--line);border-radius:10px;color:var(--accent);background:rgba(255,255,255,.04);font:inherit;font-size:12px;font-weight:700;cursor:pointer;transition:all .25s ease}
.post-actions button:hover,.actions button:hover{border-color:rgba(255,255,255,.4);background:rgba(255,255,255,.12);color:#fff}
.post-actions button.liked,.actions button.liked,.like{border-color:rgba(239,119,119,.5);color:#ff9b9b;background:rgba(239,119,119,.1)}
.verified-icon{width:18px!important;height:18px!important;vertical-align:middle;border:0!important}
.avatar-link{display:block;padding:0;border:0;border-radius:50%;background:transparent;cursor:pointer}
.avatar-link:hover .avatar,.avatar-link:hover img{border-color:#fff;transform:scale(1.06)}
.comment-profile{cursor:pointer}

/* Menús ⋯ */
.post-menu,.menu,.menu-search{position:absolute;top:16px;right:16px}
.dots,.dots-search{width:34px;height:34px;border:1px solid transparent;border-radius:50%;color:var(--accent);background:transparent;font-size:20px;cursor:pointer}
.dots:hover,.dots-search:hover{border-color:var(--line2);color:#fff;background:rgba(255,255,255,.08)}
.post-menu-list,.menu-list,.menu-search>div{position:absolute;right:0;top:38px;z-index:4;min-width:160px;padding:6px;border:1px solid var(--line2);border-radius:14px;background:rgba(18,18,18,.97);box-shadow:0 15px 38px rgba(0,0,0,.6)}
.post-menu-list button,.menu-list button,.menu-search [data-delete]{display:block;width:100%;padding:10px;border:0;border-radius:9px;color:#ffadad;background:transparent;text-align:left;font:inherit;font-size:12px;font-weight:800;cursor:pointer}
.post-menu-list button:hover,.menu-list button:hover,.menu-search [data-delete]:hover{background:rgba(239,119,119,.12)}

/* ===== Comentarios ===== */
.comments{margin-top:13px;padding-top:13px;border-top:1px solid var(--line);cursor:default}
.comment-list{padding:0}
#comments-embed{margin-top:15px;padding-top:10px;border-top:1px solid var(--line)}
.comment{display:flex;gap:9px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);color:#c9c9c9;font-size:12px}
.comment img{width:30px;height:30px;border-radius:50%;object-fit:cover}
.comment b{color:#fff}
.comment-body{flex:1}
.comment-menu{border:0;padding:5px 10px;border-radius:8px;color:#ffadad;background:transparent;font-size:18px;cursor:pointer}
.comment-menu:hover{background:rgba(239,119,119,.12)}
.pager{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:14px 0}
.pager button{padding:8px 12px;border:1px solid var(--line2);border-radius:10px;color:#fff;background:rgba(255,255,255,.06);font-size:11px;font-weight:800;cursor:pointer;transition:background .2s}
.pager button:hover:not(:disabled){background:rgba(255,255,255,.14)}
.status{color:var(--muted);font-size:12px}

/* ===== Perfil ===== */
.profile{padding:24px;background:linear-gradient(135deg,rgba(0,0,0,.55),rgba(255,255,255,.06)),var(--panel)}
.profile-row{display:flex;align-items:center;gap:16px}
.profile h1{margin:0 0 5px;font-size:29px}
.profile p{margin:0;color:#b3b3b3;font-size:13px}
.profile-view{padding:22px;border-bottom:1px solid var(--line)}
.profile-cover{padding:22px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(135deg,rgba(0,0,0,.5),rgba(255,255,255,.07))}
.profile-cover h2{margin:10px 0 6px}
.profile-cover p{margin:0;color:#b3b3b3;font-size:12px}
.profile-stats{display:flex;flex-wrap:wrap;gap:14px 24px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line);color:var(--accent);font-size:13px}
.profile-stats span{min-width:140px;padding:10px 17px;text-align:center;border:1px solid var(--line2);border-radius:999px;background:rgba(255,255,255,.04)}
.profile-stats b{color:#fff}
.follow-lists{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:15px}
.follow-list{padding:12px;border:1px solid var(--line);border-radius:14px;color:var(--muted);font-size:12px}
.follow-list b{display:block;margin-bottom:7px;color:#fff}

/* ===== Onboarding ===== */
.onboarding{width:min(620px,100%);margin:55px auto;padding:34px}
.onboarding h1{margin:0 0 8px;font-size:34px}
.onboarding p{color:var(--muted);line-height:1.6}
.eyebrow{display:inline-flex;align-items:center;gap:8px;margin-bottom:8px;color:var(--accent);font-size:11px;font-weight:800;letter-spacing:.2em;text-transform:uppercase}
.eyebrow::before{content:"";width:30px;height:1px;background:var(--accent)}
.welcome{display:flex;align-items:center;gap:16px;margin:22px 0;padding:16px;border:1px solid var(--line);border-radius:16px;background:rgba(0,0,0,.25)}

/* ===== Varios ===== */
.empty,.loading{padding:60px 24px;text-align:center;color:var(--muted)}
.toast{position:fixed;right:22px;bottom:22px;z-index:120;max-width:360px;padding:13px 16px;border:1px solid var(--line2);border-radius:14px;color:#fff;background:rgba(20,20,20,.95);backdrop-filter:blur(20px);box-shadow:0 18px 45px rgba(0,0,0,.7);animation:appear .2s ease}

/* ===== Modales ===== */
.modal{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:18px;background:rgba(0,0,0,.75);backdrop-filter:blur(6px)}
.modal-card{width:min(580px,100%);max-height:90vh;overflow:auto;padding:24px;border:1px solid var(--line2);border-radius:22px;background:rgba(20,20,20,.95);box-shadow:0 30px 100px rgba(0,0,0,.8);animation:pop .25s cubic-bezier(.23,1,.32,1)}
.detail-card{width:min(680px,100%)}
.comments-card{width:min(620px,100%)}
.modal-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:0 0 16px;padding:0;border:0}
.modal-head h2{margin:0}
.detail{padding:0}
.detail-card .post,.modal-card .post{border:0;cursor:default}
.detail-card .post:hover,.modal-card .post:hover{transform:none;background:transparent}
.close{width:34px;height:34px;border:1px solid var(--line2);border-radius:50%;color:#fff;background:rgba(255,255,255,.06);font-size:20px;cursor:pointer;transition:background .2s}
.close:hover{background:rgba(255,255,255,.16)}
.form-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:5px}

/* ===== Botón de seleccionar archivo ===== */
input[type=file]{padding:8px;border:1px dashed rgba(255,255,255,.3);border-radius:14px;background:rgba(255,255,255,.04);color:var(--muted);font-size:12px;cursor:pointer;transition:all .3s ease}
input[type=file]:hover{border-color:#fff;background:rgba(255,255,255,.09)}
input[type=file]:focus{border-style:solid}
input[type=file]::file-selector-button{margin-right:12px;padding:10px 16px;border:1px solid #fff;border-radius:10px;color:#0a0a0a;background:#fff;font:inherit;font-weight:800;cursor:pointer;transition:all .3s ease}
input[type=file]::file-selector-button:hover{background:#e5e5e5;transform:translateY(-2px);box-shadow:0 10px 24px rgba(255,255,255,.18)}
input[type=file]::-webkit-file-upload-button{margin-right:12px;padding:10px 16px;border:1px solid #fff;border-radius:10px;color:#0a0a0a;background:#fff;font:inherit;font-weight:800;cursor:pointer}

/* ===== Nieve ===== */
#nieve{position:fixed;inset:0;z-index:40;pointer-events:none;overflow:hidden}
.copo{position:absolute;top:-24px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#fff,#cfe4ff);box-shadow:0 0 8px rgba(255,255,255,.8);animation:caerNieve linear infinite}
@keyframes caerNieve{0%{transform:translate3d(0,-6vh,0) rotate(0)}100%{transform:translate3d(var(--der,0px),108vh,0) rotate(360deg)}}

/* ===== Responsive ===== */
@media(max-width:1080px){.app{grid-template-columns:190px minmax(0,1fr)}.right{display:none}}
@media(max-width:700px){
  .page{width:min(100% - 18px,680px);padding-top:10px}
  .app{display:block}
  .side{position:static;margin-bottom:12px}
  .side-note{display:none}
  .nav{display:flex;flex-wrap:wrap}
  .nav button{flex:1;justify-content:center}
  .feed-head{align-items:flex-start;flex-direction:column}
  .search{width:100%;max-width:none}
  .compose{padding:14px;flex-direction:column}
  .compose .btn{align-self:flex-end}
  .onboarding{margin:25px auto;padding:24px}
  .top{align-items:flex-start;flex-direction:column}
  .profile-row{align-items:flex-start;flex-direction:column}
  .follow-lists{grid-template-columns:1fr}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

</style>
</head>
<body><main class="page"><div class="top"><strong>「ME:RP」 Medellín RP · Resultados de búsqueda</strong><a href="/twitter.html">← Volver al inicio</a></div><a class="back" href="/twitter.html">← Regresar al inicio de Twitter</a><section class="box"><header class="head"><h1>Resultados encontrados</h1><p>Publicaciones relacionadas con tu búsqueda.</p><span id="query" class="query">Buscando...</span></header><div id="results"><div class="loading">Buscando publicaciones...</div></div></section></main><div id="modal" class="modal" hidden><div class="modal-card"><div class="modal-head"><h2>Publicación</h2><button class="close" id="close">×</button></div><div id="detail" class="detail"></div></div></div><div id="comments-modal" class="modal" hidden><div class="modal-card"><div class="modal-head"><h2>💬 Comentarios</h2><button class="close" id="comments-close">×</button></div><div id="comments-list" class="comment-list"></div></div></div><div id="toast" class="toast" hidden></div>
<script>
const VERIFIED_ICON="https://cdn-icons-png.flaticon.com/512/6711/6711626.png";const DEFAULT_AVATAR="https://cdn.pixabay.com/photo/2023/02/18/11/00/icon-7797704_1280.png";const query=new URLSearchParams(location.search).get("q")||"";let currentPosts=[],currentAccount=null,commentPages={},commentDrafts={};const $=s=>document.querySelector(s),esc=v=>String(v??"").replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])),date=v=>new Date(v).toLocaleString("es-CO",{dateStyle:"medium",timeStyle:"short",timeZone:"America/Bogota"});async function api(u,o={}){const r=await fetch(u,{...o,cache:"no-store",headers:{"Content-Type":"application/json",...(o.headers||{})}}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||"No se pudo completar la solicitud.");return d}function toast(t){const e=$("#toast");e.textContent=t;e.hidden=false;setTimeout(()=>e.hidden=true,2800)}
function card(p,modal=false){const own=!modal&&((p.propia===true||Number(p.propia)===1)||(currentAccount&&(String(p.cuenta_id)===String(currentAccount.id)||String(p.autor_discord_id)===String(currentAccount.discord_id))));return `<article class="result" data-id="${p.id}">${own?`<div class="menu-search"><button class="dots-search" data-dots="${p.id}" type="button">⋯</button><div id="menu-${p.id}" hidden><button data-delete="${p.id}" type="button">🗑️ Eliminar publicación</button></div></div>`:""}<div class="author"><button class="avatar-link" data-profile="${esc(p.autor_discord_id)}" type="button"><img class="avatar" src="${esc(p.autor_avatar||DEFAULT_AVATAR)}" alt=""></button><div><b>${esc(p.autor_nombre)} ${Number(p.autor_verificado)?`<img class="verified-icon" src="${VERIFIED_ICON}" alt="Verificado">`:""}</b><small>@${esc(p.autor_discord_id)} · ${date(p.creado_en)}</small></div></div><h2 class="title">${esc(p.nombre)}</h2><p class="desc">${esc(p.descripcion)}</p>${p.imagen_url?`<img class="photo" src="${esc(p.imagen_url)}" alt="">`:""}<div class="actions"><button class="like-btn ${p.liked?"liked":""}" data-like="${p.id}">${p.liked?"♥":"♡"} ${Number(p.likes||0)}</button><button data-comments="${p.id}">▢ ${Number(p.comentarios||0)} comentarios</button></div></article>`}
function render(){$("#results").innerHTML=currentPosts.length?currentPosts.map(card).join(""):'<div class="empty">No encontramos publicaciones con ese texto.</div>'}
async function deletePost(id){if(!confirm("¿Eliminar esta publicación?"))return;try{await api(`/api/twitter/publicaciones/${id}`,{method:"DELETE"});currentPosts=currentPosts.filter(p=>String(p.id)!==String(id));$("#modal").hidden=true;render();toast("Publicación eliminada")}catch(e){toast(e.message)}}
async function likePost(id){const p=currentPosts.find(x=>String(x.id)===String(id));if(!p)return;const old=Boolean(p.liked),oldN=Number(p.likes||0);p.liked=!old;p.likes=Math.max(0,oldN+(p.liked?1:-1));render();try{const d=await api(`/api/twitter/publicaciones/${id}/like`,{method:"POST"});p.liked=Boolean(d.liked);p.likes=Number(d.likes||0);openDetail(id)}catch(e){p.liked=old;p.likes=oldN;render();toast(e.message)}}
function commentHtml(c,postId){const own=currentAccount&&String(c.cuenta_id)===String(currentAccount.id);return `<div class="comment"><button class="avatar-link" data-profile="${esc(c.discord_id)}" type="button"><img src="${esc(c.avatar_url||DEFAULT_AVATAR)}" alt=""></button><div><b>${esc(c.nombre)}</b><br>${esc(c.texto)}</div>${own&&c.id&&!String(c.id).startsWith("draft-")?`<button class="comment-menu" data-delete-comment="${c.id}" data-comment-post="${postId}" type="button">⋯</button>`:""}</div>`}
async function showComments(id){$("#comments-modal").hidden=false;const box=$("#comments-list");box.innerHTML="<div class=loading>Cargando comentarios...</div>";try{const d=await api(`/api/twitter/publicaciones/${id}/comentarios`),serverComments=d.comentarios||[],all=[...serverComments,...(commentDrafts[id]||[]).filter(x=>!serverComments.some(c=>c.texto===x.texto))],page=commentPages[id]||1,total=Math.max(1,Math.ceil(all.length/5)),safe=Math.min(page,total);commentPages[id]=safe;const list=all.slice((safe-1)*5,safe*5);box.innerHTML=(list.length?list.map(c=>commentHtml(c,id)).join(""):"<div class=empty>No hay comentarios todavía.</div>")+`<div class=pager><button data-comment-page="${id}" data-page="${safe-1}" ${safe<=1?"disabled":""}>← Anteriores</button><span>Página ${safe} de ${total}</span><button data-comment-page="${id}" data-page="${safe+1}" ${safe>=total?"disabled":""}>Siguientes →</button></div><form class=comment-form data-comment-form="${id}"><input name="texto" required maxlength="600" placeholder="Agrega tu comentario..."><button>Comentar</button></form>`}catch(e){box.innerHTML=`<div class=empty>${esc(e.message)}</div>`}}
function openDetail(id){const p=currentPosts.find(x=>String(x.id)===String(id));if(!p)return;$("#detail").innerHTML=card(p,true)+`<div class="comment-list" style="padding:18px 0"><button data-comments="${p.id}">💬 Abrir comentarios</button></div>`;$("#modal").hidden=false}
async function deleteComment(id,postId){if(!confirm("¿Eliminar este comentario?"))return;try{await api(`/api/twitter/comentarios/${id}`,{method:"DELETE"});await showComments(postId)}catch(e){toast(e.message)}}
async function loadResults(){try{const me=await api("/api/twitter/me");currentAccount=me.cuenta;const d=await api(`/api/twitter/buscar?q=${encodeURIComponent(query)}`);currentPosts=d.publicaciones||[];$("#query").textContent=`Búsqueda: ${d.consulta}`;render()}catch(e){$("#results").innerHTML=`<div class=empty>${esc(e.message)}</div>`}}
document.addEventListener("click",e=>{const profile=e.target.closest("[data-profile]");if(profile){location.href=`/twitter-perfil.html?id=${encodeURIComponent(profile.dataset.profile)}`;return}const like=e.target.closest("[data-like]");if(like){e.stopPropagation();likePost(like.dataset.like);return}const cm=e.target.closest("[data-comments]");if(cm){e.stopPropagation();showComments(cm.dataset.comments);return}const pg=e.target.closest("[data-comment-page]");if(pg&&!pg.disabled){commentPages[pg.dataset.commentPage]=Number(pg.dataset.page);showComments(pg.dataset.commentPage);return}const dc=e.target.closest("[data-delete-comment]");if(dc){deleteComment(dc.dataset.deleteComment,dc.dataset.commentPost);return}const del=e.target.closest("[data-delete]");if(del){e.stopPropagation();deletePost(del.dataset.delete);return}const dots=e.target.closest("[data-dots]");if(dots){e.stopPropagation();const m=$("#menu-"+dots.dataset.dots);if(m)m.hidden=!m.hidden;return}const result=e.target.closest("[data-id]");if(result&&!e.target.closest("button")&&!e.target.closest("input"))openDetail(result.dataset.id)});
document.addEventListener("submit",e=>{const form=e.target.closest("[data-comment-form]");if(!form)return;e.preventDefault();const id=form.dataset.commentForm,texto=new FormData(form).get("texto"),draft={id:`draft-${Date.now()}`,cuenta_id:currentAccount.id,nombre:currentAccount.nombre,discord_id:currentAccount.discord_id,avatar_url:currentAccount.avatar_url,texto};commentDrafts[id]=[...(commentDrafts[id]||[]),draft];form.reset();commentPages[id]=1;showComments(id);(async()=>{try{await api(`/api/twitter/publicaciones/${id}/comentarios`,{method:"POST",body:JSON.stringify({texto})});commentDrafts[id]=(commentDrafts[id]||[]).filter(x=>x.id!==draft.id);await showComments(id)}catch(err){commentDrafts[id]=(commentDrafts[id]||[]).filter(x=>x.id!==draft.id);await showComments(id);toast(err.message)}})()});$("#close").onclick=()=>$("#modal").hidden=true;$("#comments-close").onclick=()=>$("#comments-modal").hidden=true;$("#modal").onclick=e=>{if(e.target.id==="modal")$("#modal").hidden=true};$("#comments-modal").onclick=e=>{if(e.target.id==="comments-modal")$("#comments-modal").hidden=true};loadResults();
</script>
<script>
(function () {
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  let contenedor = document.getElementById("nieve");
  if (!contenedor) {
    contenedor = document.createElement("div");
    contenedor.id = "nieve";
    contenedor.setAttribute("aria-hidden", "true");
    document.body.appendChild(contenedor);
  }
  const total = window.innerWidth < 760 ? 26 : 60;
  for (let i = 0; i < total; i++) {
    const copo = document.createElement("span");
    copo.className = "copo";
    const t = 3 + Math.random() * 7;
    copo.style.width = t + "px";
    copo.style.height = t + "px";
    copo.style.left = Math.random() * 100 + "%";
    copo.style.opacity = 0.35 + Math.random() * 0.6;
    copo.style.setProperty("--der", Math.random() * 120 - 60 + "px");
    copo.style.animationDuration = 9 + Math.random() * 14 + "s";
    copo.style.animationDelay = -Math.random() * 20 + "s";
    contenedor.appendChild(copo);
  }
})();

</script>
