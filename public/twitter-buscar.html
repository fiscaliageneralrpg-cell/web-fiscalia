<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Buscar publicaciones · Medellín RP</title>
<style>
:root{--bg:#071722;--panel:#0d2939ee;--cyan:#42d8d0;--muted:#9db5c0;--line:#ffffff18;--red:#ef7777}*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;min-height:100vh;color:#eff8f5;background:radial-gradient(circle at 8% 0,#15505a66,transparent 34%),linear-gradient(145deg,#06141f,#071d2c 60%,#101d3b);font-family:Inter,system-ui,sans-serif}.page{width:min(900px,calc(100% - 28px));margin:auto;padding:25px 0 60px;animation:enter .38s cubic-bezier(.23,1,.32,1)}.top{display:flex;justify-content:space-between;gap:14px;align-items:center;margin-bottom:18px;color:#c5e5e3;font-size:13px}.top a{color:var(--cyan);font-weight:800;text-decoration:none}.box{border:1px solid var(--line);border-radius:22px;background:var(--panel);box-shadow:0 25px 70px #0005;overflow:hidden}.head{padding:24px;border-bottom:1px solid var(--line);background:linear-gradient(125deg,#0b454c,#112d50)}h1{margin:0;font-size:28px;letter-spacing:-.04em}.head p{margin:7px 0 0;color:#c5dadd}.query{display:inline-block;margin-top:15px;padding:8px 12px;border:1px solid #42d8d066;border-radius:999px;color:var(--cyan);background:#42d8d012;font-weight:800}.back{display:inline-block;margin-bottom:16px;padding:10px 13px;border:1px solid #42d8d055;border-radius:10px;color:var(--cyan);background:#42d8d012;text-decoration:none;font-weight:800;font-size:12px}.result{padding:20px;border-bottom:1px solid var(--line);cursor:pointer;animation:rise .32s ease both;transition:background .2s,transform .2s}.result:hover{background:#42d8d009;transform:translateX(3px)}.author{display:flex;align-items:center;gap:10px}.avatar{width:44px;height:44px;border:2px solid #42d8d066;border-radius:50%;object-fit:cover}.author b{display:block}.author small,.desc,.empty{color:var(--muted);font-size:12px}.title{margin:14px 0 6px;font-size:18px}.desc{white-space:pre-wrap;line-height:1.55;font-size:14px;color:#c6d7dc}.photo{display:block;max-width:100%;max-height:400px;margin-top:14px;border-radius:13px;border:1px solid var(--line)}.actions{margin-top:13px;color:#a9c1c8;font-size:12px;font-weight:800}.empty{padding:70px 20px;text-align:center}.loading{padding:70px;text-align:center;color:var(--muted)}.modal{position:fixed;inset:0;z-index:5;display:grid;place-items:center;padding:18px;background:#02080dcc;backdrop-filter:blur(8px)}.modal-card{width:min(680px,100%);max-height:90vh;overflow:auto;border:1px solid #42d8d077;border-radius:20px;background:#0d2939;box-shadow:0 30px 100px #0009;animation:pop .25s ease}.modal-head{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid var(--line)}.modal-head h2{margin:0}.close{width:34px;height:34px;border:1px solid var(--line);border-radius:50%;color:#fff;background:transparent;font-size:20px;cursor:pointer}.detail{padding:20px}.like{border:1px solid #ef777766;border-radius:9px;padding:8px 11px;color:#ffadad;background:#ef777712;font-weight:800;cursor:pointer}.toast{position:fixed;right:18px;bottom:18px;padding:12px 15px;border:1px solid #42d8d077;border-radius:12px;background:#0c3545;box-shadow:0 15px 40px #0008}@keyframes enter{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:translateX(0)}}@keyframes rise{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}@media(max-width:600px){.top{align-items:flex-start;flex-direction:column}.head{padding:20px}}
</style></head>
<body><main class="page"><div class="top"><strong>「ME:RP」 Medellín RP · Resultados de búsqueda</strong><a href="/twitter.html">← Volver al inicio</a></div><a class="back" href="/twitter.html">← Regresar al inicio de Twitter</a><section class="box"><header class="head"><h1>Resultados encontrados</h1><p>Publicaciones relacionadas con tu búsqueda.</p><span id="query" class="query">Buscando...</span></header><div id="results"><div class="loading">Buscando publicaciones...</div></div></section></main><div id="modal" class="modal" hidden><div class="modal-card"><div class="modal-head"><h2>Publicación</h2><button class="close" id="close">×</button></div><div id="detail" class="detail"></div></div></div><div id="toast" class="toast" hidden></div>
<script>
const DEFAULT_AVATAR = "https://cdn.pixabay.com/photo/2023/02/18/11/00/icon-7797704_1280.png";
const query = new URLSearchParams(location.search).get("q") || "";
const $ = (selector) => document.querySelector(selector);
const escapeHtml = (value) => String(value ?? "").replace(/[&<>\'"]/g, (char) => ({
  "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;",
}[char]));
const formatDate = (value) => new Date(value).toLocaleString("es-CO", { dateStyle: "medium", timeStyle: "short" });
async function api(url, options = {}) {
  const response = await fetch(url, { ...options, cache: "no-store", headers: { "Content-Type": "application/json", ...(options.headers || {}) } });
  const data = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(data.error || "No se pudo completar la búsqueda.");
  return data;
}
function card(post) {
  return `<article class="result" data-id="${post.id}">
    <div class="author"><img class="avatar" src="${escapeHtml(post.autor_avatar || DEFAULT_AVATAR)}" alt=""><div><b>${escapeHtml(post.autor_nombre)}</b><small>@${escapeHtml(post.autor_discord_id)} · ${formatDate(post.creado_en)}</small></div></div>
    <h2 class="title">${escapeHtml(post.nombre)}</h2><p class="desc">${escapeHtml(post.descripcion)}</p>
    ${post.imagen_url ? `<img class="photo" src="${escapeHtml(post.imagen_url)}" alt="Imagen de la publicación">` : ""}
    <div class="actions">♡ ${Number(post.likes || 0)} likes · ▢ ${Number(post.comentarios || 0)} comentarios</div>
  </article>`;
}
function openDetail(post) {
  $("#detail").innerHTML = card(post);
  $("#modal").hidden = false;
}
async function loadResults() {
  try {
    const data = await api(`/api/twitter/buscar?q=${encodeURIComponent(query)}`);
    $("#query").textContent = `Búsqueda: ${data.consulta}`;
    $("#results").innerHTML = data.publicaciones?.length
      ? data.publicaciones.map(card).join("")
      : '<div class="empty">No encontramos publicaciones con ese texto.</div>';
    $("#results").addEventListener("click", (event) => {
      const result = event.target.closest("[data-id]");
      if (!result) return;
      const post = data.publicaciones.find((item) => String(item.id) === result.dataset.id);
      if (post) openDetail(post);
    });
  } catch (error) {
    $("#results").innerHTML = `<div class="empty">${escapeHtml(error.message)}</div>`;
  }
}
$("#close").addEventListener("click", () => { $("#modal").hidden = true; });
$("#modal").addEventListener("click", (event) => { if (event.target.id === "modal") $("#modal").hidden = true; });
loadResults();
</script></body></html>
