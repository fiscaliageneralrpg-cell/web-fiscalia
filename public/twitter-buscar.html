<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Buscar publicaciones · Medellín RP</title>
<style>
:root{--bg:#071722;--panel:#0d2939ee;--cyan:#42d8d0;--muted:#9db5c0;--line:#ffffff18;--red:#ef7777}*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;min-height:100vh;color:#eff8f5;background:radial-gradient(circle at 8% 0,#15505a66,transparent 34%),linear-gradient(145deg,#06141f,#071d2c 60%,#101d3b);font-family:Inter,system-ui,sans-serif}.page{width:min(900px,calc(100% - 28px));margin:auto;padding:25px 0 60px;animation:enter .38s cubic-bezier(.23,1,.32,1)}.top{display:flex;justify-content:space-between;gap:14px;align-items:center;margin-bottom:18px;color:#c5e5e3;font-size:13px}.top a{color:var(--cyan);font-weight:800;text-decoration:none}.box{border:1px solid var(--line);border-radius:22px;background:var(--panel);box-shadow:0 25px 70px #0005;overflow:hidden}.head{padding:24px;border-bottom:1px solid var(--line);background:linear-gradient(125deg,#0b454c,#112d50)}h1{margin:0;font-size:28px;letter-spacing:-.04em}.head p{margin:7px 0 0;color:#c5dadd}.query{display:inline-block;margin-top:15px;padding:8px 12px;border:1px solid #42d8d066;border-radius:999px;color:var(--cyan);background:#42d8d012;font-weight:800}.back{display:inline-block;margin-bottom:16px;padding:10px 13px;border:1px solid #42d8d055;border-radius:10px;color:var(--cyan);background:#42d8d012;text-decoration:none;font-weight:800;font-size:12px}.result{padding:20px;border-bottom:1px solid var(--line);cursor:pointer;animation:rise .32s ease both;transition:background .2s,transform .2s}.result:hover{background:#42d8d009;transform:translateX(3px)}.author{display:flex;align-items:center;gap:10px}.avatar{width:44px;height:44px;border:2px solid #42d8d066;border-radius:50%;object-fit:cover}.author b{display:block}.author small,.desc,.empty{color:var(--muted);font-size:12px}.title{margin:14px 0 6px;font-size:18px}.desc{white-space:pre-wrap;line-height:1.55;font-size:14px;color:#c6d7dc}.photo{display:block;max-width:100%;max-height:400px;margin-top:14px;border-radius:13px;border:1px solid var(--line)}.menu-search{position:absolute;right:15px;top:15px}.result{position:relative}.dots-search{border:0;border-radius:50%;padding:6px 10px;color:#c5dadd;background:transparent;font-size:20px;cursor:pointer}.menu-search>div{position:absolute;right:0;top:38px;z-index:4;min-width:165px;padding:6px;border:1px solid #42d8d066;border-radius:11px;background:#0c2838}.menu-search [data-delete]{width:100%;padding:10px;border:0;border-radius:8px;color:#ffadad;background:transparent;text-align:left;font-weight:800;cursor:pointer}.actions{display:flex;gap:9px;margin-top:13px;color:#a9c1c8;font-size:12px;font-weight:800}.actions button{padding:8px 10px;border:1px solid transparent;border-radius:9px;color:#a9c1c8;background:transparent;font-weight:800;cursor:pointer}.actions button:hover,.actions button.liked{border-color:#ef777766;color:#ffadad;background:#ef777712}.comment-list{padding:18px 22px 22px}.comment{display:flex;gap:9px;padding:10px 0;border-bottom:1px solid var(--line);color:#c5d6db;font-size:12px}.comment img{width:30px;height:30px;border-radius:50%;object-fit:cover}.comment b{color:var(--cyan)}.comment-form{display:flex;gap:8px;margin-top:15px}.comment-form input{flex:1;min-width:0;padding:10px;border:1px solid var(--line);border-radius:9px;color:#eff8f5;background:#061923}.comment-form button{padding:10px 13px;border:0;border-radius:9px;color:#06141f;background:var(--cyan);font-weight:900}.pager{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:15px 0}.pager button{padding:8px 10px;border:1px solid #42d8d055;border-radius:8px;color:#eff8f5;background:#42d8d012;font-weight:800;cursor:pointer}.pager button:disabled{opacity:.4;cursor:not-allowed}.empty{padding:70px 20px;text-align:center}.loading{padding:70px;text-align:center;color:var(--muted)}.modal{position:fixed;inset:0;z-index:5;display:grid;place-items:center;padding:18px;background:#02080dcc;backdrop-filter:blur(8px)}.modal-card{width:min(680px,100%);max-height:90vh;overflow:auto;border:1px solid #42d8d077;border-radius:20px;background:#0d2939;box-shadow:0 30px 100px #0009;animation:pop .25s ease}.modal-head{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid var(--line)}.modal-head h2{margin:0}.close{width:34px;height:34px;border:1px solid var(--line);border-radius:50%;color:#fff;background:transparent;font-size:20px;cursor:pointer}.detail{padding:20px}.like{border:1px solid #ef777766;border-radius:9px;padding:8px 11px;color:#ffadad;background:#ef777712;font-weight:800;cursor:pointer}.toast{position:fixed;right:18px;bottom:18px;padding:12px 15px;border:1px solid #42d8d077;border-radius:12px;background:#0c3545;box-shadow:0 15px 40px #0008}@keyframes enter{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:translateX(0)}}@keyframes rise{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}@media(max-width:600px){.top{align-items:flex-start;flex-direction:column}.head{padding:20px}}
.page{position:relative}.page::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 85% 10%,#42d8d018,transparent 24%),radial-gradient(circle at 8% 75%,#4c7dff14,transparent 28%)}.box{box-shadow:0 28px 90px #0007}.head{position:relative;overflow:hidden}.head::after{content:"✦";position:absolute;right:28px;top:15px;font-size:70px;color:#42d8d022;transform:rotate(18deg)}.result{background:linear-gradient(145deg,#0d2939,#0a2132)}.result:hover{border-left:3px solid var(--cyan)}.comment-menu{border:0;padding:5px 9px;border-radius:8px;color:#ffadad;background:transparent;font-size:18px;cursor:pointer}.comment-menu:hover{background:#ef77771a}.avatar-link{padding:0;border:0;background:transparent;cursor:pointer}.actions button{background:#42d8d008}.detail [data-comments]{border:1px solid #42d8d055;border-radius:10px;color:var(--cyan);background:#42d8d012;padding:10px 13px;font-weight:800;cursor:pointer}</style></head>
<body><main class="page"><div class="top"><strong>「ME:RP」 Medellín RP · Resultados de búsqueda</strong><a href="/twitter.html">← Volver al inicio</a></div><a class="back" href="/twitter.html">← Regresar al inicio de Twitter</a><section class="box"><header class="head"><h1>Resultados encontrados</h1><p>Publicaciones relacionadas con tu búsqueda.</p><span id="query" class="query">Buscando...</span></header><div id="results"><div class="loading">Buscando publicaciones...</div></div></section></main><div id="modal" class="modal" hidden><div class="modal-card"><div class="modal-head"><h2>Publicación</h2><button class="close" id="close">×</button></div><div id="detail" class="detail"></div></div></div><div id="comments-modal" class="modal" hidden><div class="modal-card"><div class="modal-head"><h2>💬 Comentarios</h2><button class="close" id="comments-close">×</button></div><div id="comments-list" class="comment-list"></div></div></div><div id="toast" class="toast" hidden></div>
<script>
const DEFAULT_AVATAR="https://cdn.pixabay.com/photo/2023/02/18/11/00/icon-7797704_1280.png";const query=new URLSearchParams(location.search).get("q")||"";let currentPosts=[],currentAccount=null,commentPages={},commentDrafts={};const $=s=>document.querySelector(s),esc=v=>String(v??"").replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])),date=v=>new Date(v).toLocaleString("es-CO",{dateStyle:"medium",timeStyle:"short",timeZone:"America/Bogota"});async function api(u,o={}){const r=await fetch(u,{...o,cache:"no-store",headers:{"Content-Type":"application/json",...(o.headers||{})}}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||"No se pudo completar la solicitud.");return d}function toast(t){const e=$("#toast");e.textContent=t;e.hidden=false;setTimeout(()=>e.hidden=true,2800)}
function card(p,modal=false){const own=!modal&&((p.propia===true||Number(p.propia)===1)||(currentAccount&&(String(p.cuenta_id)===String(currentAccount.id)||String(p.autor_discord_id)===String(currentAccount.discord_id))));return `<article class="result" data-id="${p.id}">${own?`<div class="menu-search"><button class="dots-search" data-dots="${p.id}" type="button">⋯</button><div id="menu-${p.id}" hidden><button data-delete="${p.id}" type="button">🗑️ Eliminar publicación</button></div></div>`:""}<div class="author"><button class="avatar-link" data-profile="${esc(p.autor_discord_id)}" type="button"><img class="avatar" src="${esc(p.autor_avatar||DEFAULT_AVATAR)}" alt=""></button><div><b>${esc(p.autor_nombre)}</b><small>@${esc(p.autor_discord_id)} · ${date(p.creado_en)}</small></div></div><h2 class="title">${esc(p.nombre)}</h2><p class="desc">${esc(p.descripcion)}</p>${p.imagen_url?`<img class="photo" src="${esc(p.imagen_url)}" alt="">`:""}<div class="actions"><button class="like-btn ${p.liked?"liked":""}" data-like="${p.id}">${p.liked?"♥":"♡"} ${Number(p.likes||0)}</button><button data-comments="${p.id}">▢ ${Number(p.comentarios||0)} comentarios</button></div></article>`}
function render(){$("#results").innerHTML=currentPosts.length?currentPosts.map(card).join(""):'<div class="empty">No encontramos publicaciones con ese texto.</div>'}
async function deletePost(id){if(!confirm("¿Eliminar esta publicación?"))return;try{await api(`/api/twitter/publicaciones/${id}`,{method:"DELETE"});currentPosts=currentPosts.filter(p=>String(p.id)!==String(id));$("#modal").hidden=true;render();toast("Publicación eliminada")}catch(e){toast(e.message)}}
async function likePost(id){const p=currentPosts.find(x=>String(x.id)===String(id));if(!p)return;const old=Boolean(p.liked),oldN=Number(p.likes||0);p.liked=!old;p.likes=Math.max(0,oldN+(p.liked?1:-1));render();try{const d=await api(`/api/twitter/publicaciones/${id}/like`,{method:"POST"});p.liked=Boolean(d.liked);p.likes=Number(d.likes||0);openDetail(id)}catch(e){p.liked=old;p.likes=oldN;render();toast(e.message)}}
function commentHtml(c,postId){const own=currentAccount&&String(c.cuenta_id)===String(currentAccount.id);return `<div class="comment"><button class="avatar-link" data-profile="${esc(c.discord_id)}" type="button"><img src="${esc(c.avatar_url||DEFAULT_AVATAR)}" alt=""></button><div><b>${esc(c.nombre)}</b><br>${esc(c.texto)}</div>${own&&c.id&&!String(c.id).startsWith("draft-")?`<button class="comment-menu" data-delete-comment="${c.id}" data-comment-post="${postId}" type="button">⋯</button>`:""}</div>`}
async function showComments(id){$("#comments-modal").hidden=false;const box=$("#comments-list");box.innerHTML="<div class=loading>Cargando comentarios...</div>";try{const d=await api(`/api/twitter/publicaciones/${id}/comentarios`),serverComments=d.comentarios||[],all=[...serverComments,...(commentDrafts[id]||[]).filter(x=>!serverComments.some(c=>c.texto===x.texto))],page=commentPages[id]||1,total=Math.max(1,Math.ceil(all.length/5)),safe=Math.min(page,total);commentPages[id]=safe;const list=all.slice((safe-1)*5,safe*5);box.innerHTML=(list.length?list.map(c=>commentHtml(c,id)).join(""):"<div class=empty>No hay comentarios todavía.</div>")+`<div class=pager><button data-comment-page="${id}" data-page="${safe-1}" ${safe<=1?"disabled":""}>← Anteriores</button><span>Página ${safe} de ${total}</span><button data-comment-page="${id}" data-page="${safe+1}" ${safe>=total?"disabled":""}>Siguientes →</button></div><form class=comment-form data-comment-form="${id}"><input name="texto" required maxlength="600" placeholder="Agrega tu comentario..."><button>Comentar</button></form>`}catch(e){box.innerHTML=`<div class=empty>${esc(e.message)}</div>`}}
function openDetail(id){const p=currentPosts.find(x=>String(x.id)===String(id));if(!p)return;$("#detail").innerHTML=card(p,true)+`<div class="comment-list" style="padding:18px 0"><button data-comments="${p.id}">💬 Abrir comentarios</button></div>`;$("#modal").hidden=false}
async function deleteComment(id,postId){if(!confirm("¿Eliminar este comentario?"))return;try{await api(`/api/twitter/comentarios/${id}`,{method:"DELETE"});await showComments(postId)}catch(e){toast(e.message)}}
async function loadResults(){try{const me=await api("/api/twitter/me");currentAccount=me.cuenta;const d=await api(`/api/twitter/buscar?q=${encodeURIComponent(query)}`);currentPosts=d.publicaciones||[];$("#query").textContent=`Búsqueda: ${d.consulta}`;render()}catch(e){$("#results").innerHTML=`<div class=empty>${esc(e.message)}</div>`}}
document.addEventListener("click",e=>{const profile=e.target.closest("[data-profile]");if(profile){location.href=`/twitter-perfil.html?id=${encodeURIComponent(profile.dataset.profile)}`;return}const like=e.target.closest("[data-like]");if(like){e.stopPropagation();likePost(like.dataset.like);return}const cm=e.target.closest("[data-comments]");if(cm){e.stopPropagation();showComments(cm.dataset.comments);return}const pg=e.target.closest("[data-comment-page]");if(pg&&!pg.disabled){commentPages[pg.dataset.commentPage]=Number(pg.dataset.page);showComments(pg.dataset.commentPage);return}const dc=e.target.closest("[data-delete-comment]");if(dc){deleteComment(dc.dataset.deleteComment,dc.dataset.commentPost);return}const del=e.target.closest("[data-delete]");if(del){e.stopPropagation();deletePost(del.dataset.delete);return}const dots=e.target.closest("[data-dots]");if(dots){e.stopPropagation();const m=$("#menu-"+dots.dataset.dots);if(m)m.hidden=!m.hidden;return}const result=e.target.closest("[data-id]");if(result&&!e.target.closest("button")&&!e.target.closest("input"))openDetail(result.dataset.id)});
document.addEventListener("submit",e=>{const form=e.target.closest("[data-comment-form]");if(!form)return;e.preventDefault();const id=form.dataset.commentForm,texto=new FormData(form).get("texto"),draft={id:`draft-${Date.now()}`,cuenta_id:currentAccount.id,nombre:currentAccount.nombre,discord_id:currentAccount.discord_id,avatar_url:currentAccount.avatar_url,texto};commentDrafts[id]=[...(commentDrafts[id]||[]),draft];form.reset();commentPages[id]=1;showComments(id);(async()=>{try{await api(`/api/twitter/publicaciones/${id}/comentarios`,{method:"POST",body:JSON.stringify({texto})});commentDrafts[id]=(commentDrafts[id]||[]).filter(x=>x.id!==draft.id);await showComments(id)}catch(err){commentDrafts[id]=(commentDrafts[id]||[]).filter(x=>x.id!==draft.id);await showComments(id);toast(err.message)}})()});$("#close").onclick=()=>$("#modal").hidden=true;$("#comments-close").onclick=()=>$("#comments-modal").hidden=true;$("#modal").onclick=e=>{if(e.target.id==="modal")$("#modal").hidden=true};$("#comments-modal").onclick=e=>{if(e.target.id==="comments-modal")$("#comments-modal").hidden=true};loadResults();
</script></body></html>
