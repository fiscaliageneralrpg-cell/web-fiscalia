<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Perfil Twitter · Medellín RP</title><style>:root{--bg:#071722;--panel:#0d2939ee;--cyan:#42d8d0;--muted:#9db5c0;--line:#ffffff18;--red:#ef7777}*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;min-height:100vh;color:#eff8f5;background:radial-gradient(circle at 8% 0,#15505a66,transparent 35%),linear-gradient(145deg,#06141f,#071d2c 60%,#101d3b);font-family:Inter,system-ui,sans-serif}.page{width:min(850px,calc(100% - 28px));margin:auto;padding:25px 0 60px;animation:enter .35s ease}.top{display:flex;justify-content:space-between;gap:14px;margin-bottom:18px;color:#c5e5e3;font-size:13px}.top a,.back{color:var(--cyan);font-weight:800;text-decoration:none}.back{display:inline-block;margin-bottom:15px;padding:10px 13px;border:1px solid #42d8d055;border-radius:10px;background:#42d8d012;font-size:12px}.profile,.post{border:1px solid var(--line);background:var(--panel);box-shadow:0 22px 60px #0004}.profile{padding:24px;border-radius:22px;background:linear-gradient(135deg,#0d5058,#273b78);}.profile-row{display:flex;align-items:center;gap:16px}.avatar{width:78px;height:78px;border:3px solid #42d8d0aa;border-radius:50%;object-fit:cover}.profile h1{margin:0 0 5px;font-size:29px}.profile p{margin:0;color:#c6dce0;font-size:13px}.profile-stats{display:flex;flex-wrap:wrap;gap:28px;margin-top:16px;color:#d8eeec;font-size:13px}.profile-stats b{color:var(--cyan)}.profile-stats span{padding:8px 15px;border:1px solid #42d8d044;border-radius:999px;background:#42d8d00b}.follow-btn{margin-top:15px;padding:10px 15px;border:1px solid #42d8d077;border-radius:10px;color:#06141f;background:var(--cyan);font-weight:900;cursor:pointer}.follow-btn.following{color:#dff9f4;background:#ffffff16}.follow-lists{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:15px}.follow-list{padding:12px;border:1px solid var(--line);border-radius:12px;color:var(--muted);font-size:12px}.follow-list b{display:block;margin-bottom:7px;color:#c5e5e3}.follow-list div{margin:4px 0}@media(max-width:600px){.follow-lists{grid-template-columns:1fr}}.posts{margin-top:16px;border-radius:22px;overflow:hidden}.post{position:relative;padding:20px;border-bottom:1px solid var(--line);animation:rise .3s ease}.author{display:flex;align-items:center;gap:10px}.author img{width:44px;height:44px}.author b{display:block}.author small,.desc,.empty{color:var(--muted);font-size:12px}.title{margin:14px 0 6px;font-size:18px}.desc{color:#c5d6db;line-height:1.55;font-size:14px;white-space:pre-wrap}.photo{display:block;max-width:100%;max-height:450px;margin-top:14px;border-radius:13px;border:1px solid var(--line)}.actions{display:flex;gap:8px;margin-top:13px;color:#a9c1c8;font-size:12px;font-weight:800}.actions button{padding:8px 10px;border:1px solid transparent;border-radius:9px;color:#a9c1c8;background:transparent;font-weight:800;cursor:pointer}.actions button:hover,.actions button.liked{border-color:#ef777766;color:#ffadad;background:#ef777712}.avatar-link{padding:0;border:0;border-radius:50%;background:transparent;cursor:pointer}.avatar-link:hover img{border-color:var(--cyan)}.post{cursor:pointer}.modal{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:18px;background:#02080dcc;backdrop-filter:blur(8px)}.modal-card{width:min(680px,100%);max-height:90vh;overflow:auto;padding:22px;border:1px solid #42d8d077;border-radius:20px;background:#0d2939;box-shadow:0 30px 100px #0009}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.close{width:34px;height:34px;border:1px solid var(--line);border-radius:50%;color:white;background:transparent;font-size:20px;cursor:pointer}.comment-list{margin-top:15px;padding-top:10px;border-top:1px solid var(--line)}.comment{display:flex;gap:9px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);font-size:12px;color:#c5d6db}.comment img{width:32px;height:32px;border-radius:50%;object-fit:cover}.comment b{color:var(--cyan)}.comment .comment-body{flex:1}.comment-menu{float:right;border:0;color:#ffadad;background:transparent;cursor:pointer}.comment-form{display:flex;gap:8px;margin-top:13px}.comment-form input{flex:1;min-width:0;padding:10px;border:1px solid var(--line);border-radius:9px;color:white;background:#061923}.comment-form button{padding:10px 13px;border:0;border-radius:9px;color:#06141f;background:var(--cyan);font-weight:900}.pager{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:13px 0}.pager button{padding:8px;border:1px solid #42d8d055;border-radius:8px;color:#eff8f5;background:#42d8d012;font-weight:800;cursor:pointer}.pager button:disabled{opacity:.4}.comment-profile{cursor:pointer}.menu{position:absolute;right:15px;top:15px}.dots{width:34px;height:34px;border:1px solid transparent;border-radius:50%;color:#c4d9dc;background:transparent;font-size:20px;cursor:pointer}.dots:hover{border-color:#42d8d055;color:var(--cyan)}.menu-list{position:absolute;right:0;top:38px;z-index:2;min-width:160px;padding:6px;border:1px solid #42d8d066;border-radius:12px;background:#0c2838}.menu-list button{width:100%;padding:10px;border:0;border-radius:8px;color:#ffadad;background:transparent;text-align:left;font-weight:800;cursor:pointer}.empty,.loading{padding:65px 20px;text-align:center}.toast{position:fixed;right:18px;bottom:18px;padding:12px 15px;border:1px solid #42d8d077;border-radius:12px;background:#0c3545}@keyframes enter{from{opacity:0;transform:translateX(25px)}to{opacity:1;transform:translateX(0)}}@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}@media(max-width:600px){.top{flex-direction:column}.profile-row{align-items:flex-start;flex-direction:column}}
</style></head><body><main class="page"><div class="top"><strong>「ME:RP」 Medellín RP · Perfil Twitter</strong><a href="/twitter.html">← Inicio Twitter</a></div><a class="back" href="/twitter.html">← Volver a Twitter</a><section id="profile" class="profile"><div class="loading">Cargando perfil...</div></section><section id="posts" class="posts"><div class="loading">Cargando publicaciones...</div></section></main><div id="post-modal" class="modal" hidden><div class="modal-card"><div class="modal-head"><h2>Publicación</h2><button class="close" id="post-close">×</button></div><div id="post-detail"></div></div></div><div id="toast" class="toast" hidden></div><script>
const DEFAULT_AVATAR="https://cdn.pixabay.com/photo/2023/02/18/11/00/icon-7797704_1280.png";
const targetId=new URLSearchParams(location.search).get("id");let me=null,profile=null,posts=[],commentPages={},commentDrafts={};const $=s=>document.querySelector(s);const esc=v=>String(v??"").replace(/[&<>\'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[c]));const date=v=>new Date(v).toLocaleString("es-CO",{dateStyle:"medium",timeStyle:"short",timeZone:"America/Bogota"});
async function api(u,o={}){const r=await fetch(u,{...o,cache:"no-store",headers:{"Content-Type":"application/json",...(o.headers||{})}}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||"No se pudo completar la solicitud.");return d}function toast(t){const e=$("#toast");e.textContent=t;e.hidden=false;setTimeout(()=>e.hidden=true,2800)}
function renderPost(p,modal=false){const own=!modal&&me&&(String(me.id)===String(p.cuenta_id)||String(me.discord_id)===String(p.autor_discord_id));return `<article class="post" data-post="${p.id}">${own?`<div class="menu"><button class="dots" data-dots="${p.id}">⋯</button><div class="menu-list" id="menu-${p.id}" hidden><button data-delete-post="${p.id}">🗑️ Eliminar publicación</button></div></div>`:""}<div class="author"><button class="avatar-link" data-profile="${esc(p.autor_discord_id)}"><img class="avatar" src="${esc(p.autor_avatar||DEFAULT_AVATAR)}"></button><div><b>${esc(p.autor_nombre)}</b><small>@${esc(p.autor_discord_id)} · ${date(p.creado_en)}</small></div></div><h2 class="title">${esc(p.nombre)}</h2><p class="desc">${esc(p.descripcion)}</p>${p.imagen_url?`<img class="photo" src="${esc(p.imagen_url)}">`:""}<div class="actions"><button class="like-btn ${p.liked?"liked":""}" data-like="${p.id}">${p.liked?"♥":"♡"} ${Number(p.likes||0)}</button><button data-comments="${p.id}">▢ ${Number(p.comentarios||0)} comentarios</button></div></article>`}
function renderProfile(){const seguidores=profile.seguidores_lista||[],siguiendo=profile.siguiendo_lista||[];const lists=`${seguidores.length?`<div class="follow-list"><b>Seguidores</b>${seguidores.map(x=>`<div>${esc(x.nombre)}</div>`).join("")}</div>`:""}${siguiendo.length?`<div class="follow-list"><b>Está siguiendo</b>${siguiendo.map(x=>`<div>${esc(x.nombre)}</div>`).join("")}</div>`:""}`;$("#profile").innerHTML=`<div class="profile-row"><img class="avatar" src="${esc(profile.avatar_url||DEFAULT_AVATAR)}"><div><h1>${esc(profile.nombre)}</h1><p>Perfil ciudadano de Twitter · Creado ${date(profile.creado_en)}</p></div></div><div class="profile-stats"><span><b>${Number(profile.seguidores||0)}</b> seguidores</span><span><b>${Number(profile.siguiendo||0)}</b> siguiendo</span></div>${String(me.id)!==String(profile.id)?`<button class="follow-btn ${profile.siguiendo_cuenta?"following":""}" data-follow="${esc(profile.discord_id)}">${profile.siguiendo_cuenta?"✓ Siguiendo":"＋ Seguir"}</button>`:""}${lists?`<div class="follow-lists">${lists}</div>`:""}`;$("#posts").innerHTML=posts.length?posts.map(renderPost).join(""):'<div class="empty">Este usuario todavía no tiene publicaciones.</div>'}
async function load(){try{const current=await api("/api/twitter/me");me=current.cuenta;const d=await api(`/api/twitter/perfil/${encodeURIComponent(targetId)}`);profile=d.cuenta;posts=d.publicaciones||[];renderProfile()}catch(e){$("#profile").innerHTML=`<div class=empty>${esc(e.message)}</div>`}}
async function toggleFollow(discordId,button){button.disabled=true;try{const d=await api(`/api/twitter/cuentas/${encodeURIComponent(discordId)}/seguir`,{method:"POST"});profile.siguiendo_cuenta=Boolean(d.siguiendo_cuenta);profile.seguidores=d.seguidores;profile.siguiendo=d.siguiendo;renderProfile();toast(d.siguiendo_cuenta?"Ahora sigues esta cuenta":"Dejaste de seguir esta cuenta")}catch(e){toast(e.message)}finally{button.disabled=false}}
async function toggleLike(id,button){const p=posts.find(x=>String(x.id)===String(id));if(!p||button.disabled)return;const old=Boolean(p.liked),oldN=Number(p.likes||0);p.liked=!old;p.likes=Math.max(0,oldN+(p.liked?1:-1));renderProfile();openPost(id);try{const d=await api(`/api/twitter/publicaciones/${id}/like`,{method:"POST"});p.liked=Boolean(d.liked);p.likes=Number(d.likes||0);openPost(id)}catch(e){p.liked=old;p.likes=oldN;renderProfile();openPost(id);toast(e.message)}}
async function removePost(id){if(!confirm("¿Eliminar esta publicación?"))return;try{await api(`/api/twitter/publicaciones/${id}`,{method:"DELETE"});posts=posts.filter(p=>String(p.id)!==String(id));$("#post-modal").hidden=true;renderProfile()}catch(e){toast(e.message)}}
function commentHtml(c){const own=me&&String(me.id)===String(c.cuenta_id);return `<div class="comment"><img class="comment-profile" data-profile="${esc(c.discord_id)}" src="${esc(c.avatar_url||DEFAULT_AVATAR)}"><div class="comment-body"><b>${esc(c.nombre)}</b><br>${esc(c.texto)}</div>${own?`<button class="comment-menu" data-delete-comment="${c.id}">⋯</button>`:""}</div>`}
async function showComments(id){const box=$("#comments-embed");if(!box)return;box.innerHTML="<div class=loading>Cargando comentarios...</div>";try{const d=await api(`/api/twitter/publicaciones/${id}/comentarios`);const serverComments=d.comentarios||[];const all=[...serverComments,...(commentDrafts[id]||[]).filter(d=>!serverComments.some(c=>c.texto===d.texto))];const page=commentPages[id]||1,total=Math.max(1,Math.ceil(all.length/5)),safe=Math.min(page,total);commentPages[id]=safe;const list=all.slice((safe-1)*5,safe*5);box.innerHTML=`<h3>💬 Comentarios</h3>${list.length?list.map(commentHtml).join(""):"<div class=empty>No hay comentarios todavía.</div>"}<div class=pager><button data-comment-page="${id}" data-page="${safe-1}" ${safe<=1?"disabled":""}>← Anteriores</button><span>Página ${safe} de ${total}</span><button data-comment-page="${id}" data-page="${safe+1}" ${safe>=total?"disabled":""}>Siguientes →</button></div><form class=comment-form data-comment-form="${id}"><input name="texto" required maxlength="600" placeholder="Agrega tu comentario..."><button>Comentar</button></form>`}catch(e){box.innerHTML=`<div class=empty>${esc(e.message)}</div>`}}
function openPost(id){const p=posts.find(x=>String(x.id)===String(id));if(!p)return;$("#post-detail").innerHTML=renderPost(p,true)+`<div id="comments-embed" class="comment-list"></div>`;$("#post-modal").hidden=false;showComments(id)}
async function deleteComment(id,postId){if(!confirm("¿Eliminar este comentario?"))return;try{await api(`/api/twitter/comentarios/${id}`,{method:"DELETE"});await showComments(postId)}catch(e){toast(e.message)}}
document.addEventListener("click",e=>{const close=e.target.closest("#post-close");if(close)$("#post-modal").hidden=true;const follow=e.target.closest("[data-follow]");if(follow){toggleFollow(follow.dataset.follow,follow);return}const profileLink=e.target.closest("[data-profile]");if(profileLink){e.stopPropagation();location.href=`/twitter-perfil.html?id=${encodeURIComponent(profileLink.dataset.profile)}`;return}const like=e.target.closest("[data-like]");if(like){e.stopPropagation();toggleLike(like.dataset.like,like);return}const cm=e.target.closest("[data-comments]");if(cm){e.stopPropagation();openPost(cm.dataset.comments);return}const pg=e.target.closest("[data-comment-page]");if(pg&&!pg.disabled){commentPages[pg.dataset.commentPage]=Number(pg.dataset.page);showComments(pg.dataset.commentPage);return}const dc=e.target.closest("[data-delete-comment]");if(dc){deleteComment(dc.dataset.deleteComment,dc.dataset.commentPost);return}const dp=e.target.closest("[data-delete-post]");if(dp){removePost(dp.dataset.deletePost);return}const dots=e.target.closest("[data-dots]");if(dots){const menu=$("#menu-"+dots.dataset.dots);if(menu)menu.hidden=!menu.hidden;return}const post=e.target.closest("[data-post]");if(post&&!e.target.closest("button")&&!e.target.closest("input"))openPost(post.dataset.post)});document.addEventListener("submit",e=>{const form=e.target.closest("[data-comment-form]");if(!form)return;e.preventDefault();const postId=form.dataset.commentForm,texto=new FormData(form).get("texto"),draft={id:`draft-${Date.now()}`,cuenta_id:me.id,nombre:me.nombre,discord_id:me.discord_id,avatar_url:me.avatar_url,texto};commentDrafts[postId]=[...(commentDrafts[postId]||[]),draft];form.reset();commentPages[postId]=1;showComments(postId);(async()=>{try{await api(`/api/twitter/publicaciones/${postId}/comentarios`,{method:"POST",body:JSON.stringify({texto})});commentDrafts[postId]=(commentDrafts[postId]||[]).filter(x=>x.id!==draft.id);await showComments(postId)}catch(err){commentDrafts[postId]=(commentDrafts[postId]||[]).filter(x=>x.id!==draft.id);await showComments(postId);toast(err.message)}})()});$("#post-modal").addEventListener("click",e=>{if(e.target.id==="post-modal")$("#post-modal").hidden=true});load();
</script></body></html>
