<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro de Cédula | Sistema</title>
    <style>
        body {
            background: #0f0f13;
            color: white;
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .form-container {
            background: #1c1c24;
            padding: 40px;
            border-radius: 15px;
            width: 100%;
            max-width: 450px;
            border: 1px solid #333;
        }
        h2 { text-align: center; margin-bottom: 30px; color: #00AAFF; }
        .input-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #aaa; font-size: 0.9rem; }
        input, textarea {
            width: 100%;
            padding: 12px;
            background: #2a2a35;
            border: 1px solid #444;
            border-radius: 8px;
            color: white;
            font-size: 1rem;
            transition: border 0.3s;
        }
        input:focus, textarea:focus { outline: none; border-color: #00AAFF; }
        textarea { height: 120px; resize: none; }
        .btn-submit {
            width: 100%;
            padding: 15px;
            background: linear-gradient(90deg, #0088ff, #00ccff);
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
            margin-top: 10px;
        }
        .btn-submit:hover { opacity: 0.9; transform: translateY(-2px); }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>SOLICITUD DE INGRESO</h2>
        <div class="input-group">
            <label>USUARIO DE ROBLOX</label>
            <input type="text" id="robloxUser" placeholder="Ej: Player123">
        </div>
        <div class="input-group">
            <label>MOTIVO DE ACCESO</label>
            <textarea id="motivo" placeholder="Explica por qué quieres ingresar..."></textarea>
        </div>
        <button class="btn-submit" onclick="enviarSolicitud()">ENVIAR A MODERACIÓN</button>
    </div>

    <script>
        async function enviarSolicitud() {
            const robloxUser = document.getElementById('robloxUser').value;
            const motivo = document.getElementById('motivo').value;
            if(!robloxUser || !motivo) return alert("Por favor completa los campos");

            const response = await fetch('/api/solicitar-ingreso', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ robloxUser, motivo })
            });

            if(response.ok) {
                window.location.href = '/espera.html';
            }
        }
    </script>
</body>
</html>
