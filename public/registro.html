<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>RENAPER | Registro de Ciudadanía</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .profile-card { background: #f0f2f5; padding: 20px; border-radius: 10px; display: flex; align-items: center; margin-bottom: 20px; }
        .profile-card img { width: 60px; height: 60px; border-radius: 50%; margin-right: 15px; border: 2px solid #0052cc; }
        .profile-card h3 { margin: 0; color: #333; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Trámite de Identidad Digital</h1>
        
        <!-- Perfil Automático de Discord -->
        <div class="profile-card" id="user-profile">
            <img id="user-avatar" src="loading.gif" alt="Avatar">
            <div>
                <h3 id="user-name">Cargando...</h3>
                <small>Autenticado con Discord</small>
            </div>
        </div>

        <form id="dni-form">
            <input type="text" name="nombre" placeholder="Nombres" required>
            <input type="text" name="apellido" placeholder="Apellidos" required>
            <input type="number" name="edad" placeholder="Edad" required>
            <input type="text" name="roblox" placeholder="Usuario de Roblox" required>
            <textarea name="motivo" placeholder="¿Por qué solicitas el DNI?" required></textarea>
            <button type="submit">Enviar Solicitud</button>
        </form>
    </div>

    <script>
        // Cargar datos del usuario al entrar
        window.onload = async () => {
            const res = await fetch('/api/user-info');
            if (res.status === 401) window.location.href = '/auth/discord';
            
            const user = await res.json();
            document.getElementById('user-avatar').src = user.avatar;
            document.getElementById('user-name').innerText = user.display_name;
        };

        // Enviar formulario
        document.getElementById('dni-form').onsubmit = async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData);

            const res = await fetch('/api/submit-dni', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            if (res.ok) {
                alert("¡Solicitud enviada! Serás redirigido a la sala de espera.");
                window.location.href = '/espera.html';
            } else {
                alert("Error al procesar tu solicitud.");
            }
        };
    </script>
</body>
</html>
