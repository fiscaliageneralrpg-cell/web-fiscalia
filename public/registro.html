<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>RENAPER | Sistema de Enrolamiento</title>
    <style>
        :root { --arg-blue: #74ACDF; --dark-bg: #0b0b0b; }
        body { background: var(--dark-bg); color: white; font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; padding: 20px; }
        .form-container { background: #151515; border: 1px solid #333; padding: 30px; border-radius: 15px; width: 100%; max-width: 500px; }
        .user-profile { display: flex; align-items: center; background: #202020; padding: 15px; border-radius: 10px; margin-bottom: 20px; border-left: 4px solid var(--arg-blue); }
        .user-profile img { width: 50px; border-radius: 50%; margin-right: 15px; }
        .input-group { margin-bottom: 15px; }
        label { display: block; color: #888; font-size: 0.8rem; margin-bottom: 5px; }
        input, select, textarea { width: 100%; padding: 10px; background: #252525; border: 1px solid #444; color: white; border-radius: 5px; box-sizing: border-box; }
        .btn-submit { background: var(--arg-blue); color: white; border: none; padding: 15px; width: 100%; border-radius: 5px; font-weight: bold; cursor: pointer; margin-top: 20px; }
        .btn-submit:hover { background: #5a8ebf; }
    </style>
</head>
<body>

    <div class="form-container">
        <h2 style="text-align: center; color: var(--arg-blue);">ENROLAMIENTO NACIONAL</h2>
        
        <!-- Datos de Discord (Llenados por la API) -->
        <div id="discord-info" class="user-profile">
            <img id="discord-avatar" src="" alt="">
            <div>
                <p id="discord-name" style="margin: 0; font-weight: bold;"></p>
                <p style="margin: 0; font-size: 0.7rem; color: #777;">IDENTIDAD VINCULADA</p>
            </div>
        </div>

        <form id="registroForm">
            <div class="input-group">
                <label>USUARIO DE ROBLOX</label>
                <input type="text" id="robloxUser" required placeholder="Ej: JuanPerez_RP">
            </div>

            <div style="display: flex; gap: 10px;">
                <div class="input-group">
                    <label>NOMBRES</label>
                    <input type="text" id="nombres" required>
                </div>
                <div class="input-group">
                    <label>APELLIDOS</label>
                    <input type="text" id="apellidos" required>
                </div>
            </div>

            <div class="input-group">
                <label>FECHA DE NACIMIENTO</label>
                <input type="text" id="nacimiento" placeholder="DD/MM/AAAA" required>
            </div>

            <div class="input-group">
                <label>LUGAR DE NACIMIENTO</label>
                <input type="text" id="lugarNacimiento" placeholder="Ciudad, Provincia" required>
            </div>

            <div style="display: flex; gap: 10px;">
                <div class="input-group" style="flex: 1;">
                    <label>NACIONALIDAD</label>
                    <select id="nacionalidad">
                        <option value="ARGENTINA">ARGENTINA</option>
                        <option value="EXTRANJERA">EXTRANJERA</option>
                    </select>
                </div>
                <div class="input-group" style="flex: 1;">
                    <label>GÉNERO</label>
                    <select id="sexo">
                        <option value="M">MASCULINO</option>
                        <option value="F">FEMENINO</option>
                        <option value="X">NO BINARIO</option>
                    </select>
                </div>
            </div>

            <div class="input-group">
                <label>¿POR QUÉ QUIERES ENTRAR AL SERVIDOR?</label>
                <textarea id="motivo" rows="3" required></textarea>
            </div>

            <button type="submit" class="btn-submit">ENVIAR SOLICITUD DE REGISTRO</button>
        </form>
    </div>

    <script>
        // Cargar info de Discord al entrar
        fetch('/api/user-info')
            .then(res => res.json())
            .then(user => {
                document.getElementById('discord-name').innerText = user.username;
                document.getElementById('discord-avatar').src = `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.png`;
            });

        document.getElementById('registroForm').onsubmit = async (e) => {
            e.preventDefault();
            const datos = {
                robloxUser: document.getElementById('robloxUser').value,
                nombres: document.getElementById('nombres').value,
                apellidos: document.getElementById('apellidos').value,
                fechaNacimiento: document.getElementById('nacimiento').value,
                lugarNacimiento: document.getElementById('lugarNacimiento').value,
                nacionalidad: document.getElementById('nacionalidad').value,
                sexo: document.getElementById('sexo').value,
                motivo: document.getElementById('motivo').value,
                fechaExpedicion: new Date().toLocaleDateString('es-AR')
            };

            const res = await fetch('/api/enviar-solicitud', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(datos)
            });

            if(res.ok) alert("Solicitud enviada. Revisa los canales de Discord.");
        };
    </script>
</body>
</html>
