<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Sistema de Identificación - BS AS RP</title>
    <style>
        body { background: #0b0b0d; color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #16161a; padding: 30px; border-radius: 15px; width: 380px; text-align: center; border: 1px solid #333; display: none; }
        #loader { text-align: center; }
        .field { background: #1f1f23; padding: 12px; margin: 8px 0; border-radius: 8px; display: flex; justify-content: space-between; font-size: 14px; }
        .label { color: #888; }
        .value { font-weight: bold; color: #3b82f6; }
        h2 { margin-top: 0; color: #3b82f6; letter-spacing: 1px; }
        .btn { display: block; background: #3b82f6; color: white; padding: 12px; border-radius: 8px; text-decoration: none; margin-top: 20px; font-weight: bold; }
    </style>
</head>
<body>

    <div id="loader"><h2>Cargando registro...</h2></div>

    <div id="card-ready" class="card">
        <h2>CIUDADANO ACTIVO</h2>
        <p style="color: #888; font-size: 13px;">Tus datos han sido sincronizados correctamente.</p>
        <div class="field"><span class="label">Nombres:</span> <span class="value" id="nom"></span></div>
        <div class="field"><span class="label">Apellidos:</span> <span class="value" id="ape"></span></div>
        <div class="field"><span class="label">NUIP:</span> <span class="value" id="nui"></span></div>
        <div class="field"><span class="label">Nacionalidad:</span> <span class="value" id="nac"></span></div>
        <div class="field"><span class="label">Estado:</span> <span class="value" style="color: #10b981;">VALIDADO</span></div>
        <a href="/" class="btn">Cerrar Sesión</a>
    </div>

    <div id="card-error" class="card">
        <h2 style="color: #ef4444;">SIN REGISTRO</h2>
        <p>No se encontró información para tu ID de Discord en el sistema.</p>
        <a href="https://discord.gg/bsas-rp" class="btn">Ir a Discord</a>
    </div>

    <script>
        async function cargar() {
            try {
                const res = await fetch('/api/verificar-ciudadano');
                const data = await res.json();
                
                document.getElementById('loader').style.display = 'none';

                if (data.registrado && data.datos) {
                    // Mapeo directo de los datos que envía el app.js
                    document.getElementById('nom').innerText = data.datos.nombres;
                    document.getElementById('ape').innerText = data.datos.apellidos;
                    document.getElementById('nui').innerText = data.datos.nuip;
                    document.getElementById('nac').innerText = data.datos.nacionalidad;
                    document.getElementById('card-ready').style.display = 'block';
                } else {
                    document.getElementById('card-error').style.display = 'block';
                }
            } catch (e) {
                console.error(e);
            }
        }
        window.onload = cargar;
    </script>
</body>
</html>
