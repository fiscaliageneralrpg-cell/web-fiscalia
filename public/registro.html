<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Buenos Aires RP | Registro</title>
    <style>
        body { background: #0f0f0f; color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #1a1a1a; padding: 30px; border-radius: 12px; width: 400px; border: 1px solid #333; text-align: center; }
        .hidden { display: none; }
        .data-preview { background: #252525; padding: 10px; border-radius: 5px; margin: 15px 0; text-align: left; font-size: 13px; border-left: 4px solid #5865F2; }
        textarea { width: 100%; height: 80px; background: #333; color: white; border: none; padding: 10px; box-sizing: border-box; border-radius: 5px; margin-top: 10px; }
        button { background: #5865F2; color: white; border: none; padding: 12px; width: 100%; border-radius: 5px; cursor: pointer; margin-top: 10px; font-weight: bold; }
        .error { color: #ff4747; font-weight: bold; }
    </style>
</head>
<body>

<div class="card">
    <div id="loader">Cargando datos...</div>

    <!-- SI NO TIENE CÉDULA -->
    <div id="no-cedula" class="hidden">
        <h2 class="error">Cédula no encontrada</h2>
        <p>No apareces en el Registro Nacional de HidenCloud.</p>
        <button onclick="location.reload()">Reintentar</button>
    </div>

    <!-- FORMULARIO SI TIENE CÉDULA -->
    <div id="form-registro" class="hidden">
        <h2>Verificación Exitosa</h2>
        <div class="data-preview" id="data-box"></div>
        
        <p>Completa tu motivo de ingreso:</p>
        <textarea id="motivo" placeholder="¿Por qué quieres entrar al servidor?"></textarea>
        <button onclick="enviar()">Finalizar Registro</button>
    </div>

    <!-- ESPERA DE APROBACIÓN -->
    <div id="espera" class="hidden">
        <h2 style="color: #ffd700;">Solicitud Pendiente</h2>
        <p>Tu solicitud está siendo revisada por el Staff.</p>
    </div>
</div>

<script>
    let nombreCompleto = "";

    async function cargar() {
        const res = await fetch('/api/verificar-estado');
        const data = await res.json();
        
        document.getElementById('loader').classList.add('hidden');

        if (!data.tieneCedula) {
            document.getElementById('no-cedula').classList.remove('hidden');
        } else if (data.estado === 'pendiente') {
            document.getElementById('espera').classList.remove('hidden');
        } else {
            document.getElementById('form-registro').classList.remove('hidden');
            nombreCompleto = `${data.datosHC.nombres} ${data.datosHC.apellidos}`;
            
            // Mostramos los datos extraídos del hosting
            document.getElementById('data-box').innerHTML = `
                <b>Nombre:</b> ${nombreCompleto}<br>
                <b>NUIP:</b> ${data.datosHC.nuip}<br>
                <b>Nacionalidad:</b> ${data.datosHC.nacionalidad}<br>
                <b>Roblox:</b> ${data.datosHC.robloxUser}
            `;
        }
    }

    async function enviar() {
        const motivo = document.getElementById('motivo').value;
        if(motivo.length < 10) return alert("Motivo muy corto");

        const res = await fetch('/api/finalizar-registro', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ motivo, nombreC: nombreCompleto })
        });

        if(res.ok) location.reload();
    }

    cargar();
</script>

</body>
</html>
