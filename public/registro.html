<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RENAPER | Buenos Aires RP</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --arg-blue: #74ACDF; --bg: #0d0d0d; --card: #161616; --text: #e0e0e0; }
        body { background-color: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background: var(--card); width: 100%; max-width: 500px; padding: 40px; border-radius: 20px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); border-top: 5px solid var(--arg-blue); }
        .header { text-align: center; margin-bottom: 30px; }
        .user-box { display: flex; align-items: center; background: #222; padding: 15px; border-radius: 12px; margin-bottom: 25px; }
        .user-box img { width: 50px; border-radius: 50%; border: 2px solid var(--arg-blue); margin-right: 15px; }
        .input-group { margin-bottom: 18px; position: relative; }
        label { display: block; font-size: 0.7rem; color: var(--arg-blue); font-weight: 800; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 1px; }
        input, select, textarea { width: 100%; background: #1a1a1a; border: 1px solid #333; color: white; padding: 12px; border-radius: 8px; font-size: 0.9rem; box-sizing: border-box; transition: 0.3s; }
        input:focus { border-color: var(--arg-blue); outline: none; box-shadow: 0 0 8px rgba(116, 172, 223, 0.3); }
        .btn-enviar { background: var(--arg-blue); color: white; border: none; width: 100%; padding: 15px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 1rem; margin-top: 10px; }
        .btn-enviar:hover { background: #5a8ebf; transform: scale(1.02); }
        .row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    </style>
</head>
<body>

    <div class="container" id="form-container">
        <div class="header">
            <img src="https://upload.wikimedia.org/wikipedia/commons/5/51/Renaper_%28logotipo%29.png" width="120" alt="RENAPER">
            <h2>ENROLAMIENTO DIGITAL</h2>
        </div>

        <div class="user-box">
            <img id="avatar" src="" alt="">
            <div>
                <span style="font-size: 0.7rem; color: #888;">CIUDADANO VINCULADO</span>
                <div id="username" style="font-weight: bold;">Cargando...</div>
            </div>
        </div>

        <form id="dniForm">
            <div class="input-group">
                <label><i class="fa-solid fa-gamepad"></i> Usuario de Roblox</label>
                <input type="text" id="roblox" placeholder="Tu username de Roblox" required>
            </div>

            <div class="row">
                <div class="input-group">
                    <label>Nombres</label>
                    <input type="text" id="nombres" required>
                </div>
                <div class="input-group">
                    <label>Apellidos</label>
                    <input type="text" id="apellidos" required>
                </div>
            </div>

            <div class="row">
                <div class="input-group">
                    <label>Fecha Nacimiento</label>
                    <input type="text" id="nac" placeholder="DD/MM/AAAA" required>
                </div>
                <div class="input-group">
                    <label>Género</label>
                    <select id="sexo">
                        <option value="M">Masculino</option>
                        <option value="F">Femenino</option>
                        <option value="X">X (No Binario)</option>
                    </select>
                </div>
            </div>

            <div class="input-group">
                <label>Lugar de Nacimiento</label>
                <input type="text" id="lugar" placeholder="Ciudad, Provincia" required>
            </div>

            <div class="input-group">
                <label>¿Por qué quieres entrar?</label>
                <textarea id="motivo" rows="2" placeholder="Escribe tus motivos de ingreso..." required></textarea>
            </div>

            <button type="submit" class="btn-enviar">ENVIAR A REVISIÓN STAFF</button>
        </form>
    </div>

    <script>
        // Cargar datos de Discord al iniciar
        fetch('/api/user-info')
            .then(res => res.json())
            .then(user => {
                document.getElementById('username').innerText = user.username;
                document.getElementById('avatar').src = `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.png`;
            })
            .catch(() => window.location.href = '/auth/discord');

        // Manejar envío del formulario
        document.getElementById('dniForm').onsubmit = async (e) => {
            e.preventDefault();
            const payload = {
                robloxUser: document.getElementById('roblox').value,
                nombres: document.getElementById('nombres').value,
                apellidos: document.getElementById('apellidos').value,
                nacimiento: document.getElementById('nac').value,
                lugarNacimiento: document.getElementById('lugar').value,
                sexo: document.getElementById('sexo').value,
                motivo: document.getElementById('motivo').value,
                nacionalidad: "ARGENTINA"
            };

            const res = await fetch('/api/enviar-solicitud', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const data = await res.json();
            if(res.ok) {
                alert("✅ Solicitud enviada. El Staff revisará tu DNI.");
                window.location.href = '/';
            } else {
                alert("❌ Error: " + data.error);
            }
        };
    </script>
</body>
</html>
