<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fiscalía General - Los Más Buscados</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .navbar-custom { background-color: #0b1d3a; }
        .wanted-card { border: 2px solid #dc3545; border-radius: 12px; overflow: hidden; box-shadow: 0 6px 15px rgba(220, 53, 69, 0.1); background: white; }
        .wanted-header { background-color: #dc3545; color: white; font-weight: bold; text-align: center; padding: 6px; font-size: 0.9rem; letter-spacing: 1px; }
        .avatar-placeholder { background-color: #e9ecef; height: 180px; display: flex; align-items: center; justify-content: center; color: #6c757d; border-bottom: 1px solid #dee2e6; }
        .footer-custom { background-color: #0b1d3a; color: white; padding: 15px 0; font-size: 0.9rem; }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#"><i class="fa-solid fa-scale-balanced me-2"></i>FISCALÍA GENERAL</a>
        </div>
    </nav>

    <div class="container my-5" style="min-height: 75vh;">
        <div class="row mb-4 text-center">
            <div class="col">
                <h1 class="fw-bold text-danger"><i class="fa-solid fa-triangle-exclamation me-2"></i>Orden de Captura Inmediata</h1>
                <p class="text-muted">Listado oficial de los ciudadanos con requerimientos judiciales activos.</p>
                <hr class="w-25 mx-auto text-danger" style="height: 3px;">
            </div>
        </div>

        <div class="row g-4" id="contenedor-buscados">
            <div class="text-center col-12" id="cargando">
                <div class="spinner-border text-danger" role="status"></div>
                <p class="mt-2 text-muted">Consultando archivos criminales...</p>
            </div>
        </div>
    </div>

    <footer class="footer-custom text-center mt-auto">
        <div class="container">
            <p class="mb-0">&copy; 2026 Fiscalía General de la Nacion RP - Todos los derechos reservados.</p>
        </div>
    </footer>

    <script>
        async function cargarBuscados() {
            try {
                const response = await fetch('/api/admin/data');
                const data = await response.json();
                
                const contenedor = document.getElementById('contenedor-buscados');
                contenedor.innerHTML = '';

                if (data.buscados.length === 0) {
                    contenedor.innerHTML = `
                        <div class="col-12 text-center my-5">
                            <i class="fa-solid fa-shield fa-3x text-success mb-3"></i>
                            <p class="text-success fs-5 fw-bold">No hay órdenes de captura activas. Ciudad en paz.</p>
                        </div>`;
                    return;
                }

                data.buscados.forEach(criminal => {
                    const html = `
                        <div class="col-sm-6 col-md-4 col-lg-3">
                            <div class="card wanted-card h-100">
                                <div class="wanted-header"><i class="fa-solid fa-skull"></i> REQUERIDO</div>
                                <div class="avatar-placeholder">
                                    <i class="fa-solid fa-user-secret fa-4x"></i>
                                </div>
                                <div class="card-body text-center bg-light p-3">
                                    <h6 class="text-muted mb-1 small fw-bold">NOMBRE COMPLETO</h6>
                                    <h5 class="card-title text-dark fw-bold mb-0">${criminal.nombre}</h5>
                                </div>
                            </div>
                        </div>
                    `;
                    contenedor.innerHTML += html;
                });
            } catch (error) {
                console.error("Error cargando buscados:", error);
                document.getElementById('contenedor-buscados').innerHTML = `
                    <div class="alert alert-danger text-center col-12" role="alert">
                        <i class="fa-solid fa-circle-exclamation me-2"></i> Error de conexión con el departamento de inteligencia.
                    </div>`;
            }
        }

        window.onload = cargarBuscados;
    </script>
</body>
</html>
