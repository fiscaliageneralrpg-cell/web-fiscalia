<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscados - Fiscalía General de la Nación</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --blue-dark: #003366; --blue-light: #1d70b8; --bg-apple: #f5f5f7;
            --text-dark: #1d1d1f; --text-muted: #86868b; --white: #ffffff; --radius: 14px;        
            --danger: #df2020;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-apple); color: var(--text-dark); padding-top: 80px; min-height: 100vh; display: flex; flex-direction: column; }
        
        /* Barra de Navegación Exacta */
        .navbar { background-color: rgba(0, 51, 102, 0.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); position: fixed; top: 0; width: 100%; z-index: 1000; border-bottom: 1px solid rgba(255, 255, 255, 0.1); }
        .nav-container { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; height: 54px; padding: 0 20px; }
        .logo { display: flex; align-items: center; gap: 12px; cursor: pointer; }
        .logo-img { height: 36px; border-radius: 4px; background-color: rgba(255, 255, 255, 0.9); padding: 2px; }
        .logo-text strong { color: var(--white); font-size: 15px; display: block; }
        .logo-text span { font-size: 9px; display: block; color: #cbd5e1; }
        .nav-menu { display: flex; list-style: none; gap: 28px; }
        .nav-menu a { color: #cbd5e1; text-decoration: none; font-size: 14px; padding: 4px 0; }
        .nav-menu a:hover, .nav-menu a.active { color: #38bdf8; }
        .btn-login { background-color: var(--white); color: var(--blue-dark); padding: 6px 16px; border-radius: 20px; text-decoration: none; font-size: 13px; font-weight: 500; }

        /* Estructura de Contenido */
        .container { max-width: 1200px; margin: 40px auto; padding: 0 20px; flex: 1; }
        .page-header { text-align: center; margin-bottom: 40px; }
        .page-title { font-size: 32px; font-weight: 700; color: var(--blue-dark); margin-bottom: 10px; }
        .page-subtitle { font-size: 16px; color: var(--text-muted); }
        
        /* Grid de Solicitados */
        .wanted-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 24px; margin-top: 20px; }
        .wanted-card { background: var(--white); border-radius: var(--radius); overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.01); border: 1px solid rgba(0,0,0,0.03); transition: transform 0.2s; text-align: center; }
        .wanted-card:hover { transform: translateY(-4px); }
        
        .wanted-top { background-color: var(--danger); color: var(--white); padding: 6px; font-size: 11px; font-weight: 700; letter-spacing: 0.8px; }
        .wanted-photo-box { background: #f2f2f7; height: 160px; display: flex; align-items: center; justify-content: center; color: var(--text-muted); border-bottom: 1px solid #f2f2f7; }
        
        .wanted-info { padding: 20px; }
        .wanted-label { font-size: 10px; font-weight: 600; color: var(--text-muted); letter-spacing: 0.5px; margin-bottom: 4px; }
        .wanted-name { font-size: 16px; font-weight: 700; color: var(--text-dark); text-transform: uppercase; }

        /* Estados */
        .loading, .empty { text-align: center; padding: 60px 0; grid-column: 1 / -1; color: var(--text-muted); }
        .spinner { display: inline-block; width: 28px; height: 28px; border: 3px solid rgba(223, 32, 32, 0.1); border-radius: 50%; border-top-color: var(--danger); animation: spin 1s infinite; margin-bottom: 12px; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo" onclick="window.location.href='index.html'">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSXBKuX8mWSlLgU5WOYx5ODP9N8QM5debq5wTdzLVi4fFWk2M8IQsowaFI&s=10" class="logo-img">
                <div class="logo-text"><strong>FISCALÍA</strong><span>GENERAL DE LA NACIÓN</span></div>
            </div>
            <ul class="nav-menu">
                <li><a href="index.html">Inicio</a></li>
                <li><a href="buscados.html" class="active">Buscados</a></li>
                <li><a href="noticias.html">Noticias</a></li>
                <li><a href="denuncias.html">Denuncias</a></li>
            </ul>
            <a href="iniciar-sesion.html" class="btn-login">Acceder</a>
        </div>
    </nav>

    <div class="container">
        <div class="page-header">
            <h1 class="page-title">Orden de Captura y Requeridos</h1>
            <p class="page-subtitle">Ciudadanos con procesos vigentes ante la justicia del país.</p>
        </div>

        <div class="wanted-grid" id="contenedor-buscados">
            <div class="loading">
                <div class="spinner"></div>
                <p>Verificando base de datos judicial...</p>
            </div>
        </div>
    </div>

    <script>
        async function cargarBuscados() {
            try {
                const response = await fetch('/api/admin/data');
                const data = await response.json();
                const contenedor = document.getElementById('contenedor-buscados');
                contenedor.innerHTML = '';

                if (data.buscados.length === 0) {
                    contenedor.innerHTML = `
                        <div class="empty">
                            <i class="fa-solid fa-shield-solid" style="font-size: 40px; color: #22c55e; margin-bottom: 12px;"></i>
                            <p style="color: #22c55e; font-weight: 500;">No se registran órdenes de captura activas.</p>
                        </div>`;
                    return;
                }

                data.buscados.forEach(criminal => {
                    contenedor.innerHTML += `
                        <div class="wanted-card">
                            <div class="wanted-top"><i class="fa-solid fa-triangle-exclamation"></i> BUSCADO</div>
                            <div class="wanted-photo-box">
                                <i class="fa-solid fa-user-secret fa-3x"></i>
                            </div>
                            <div class="wanted-info">
                                <div class="wanted-label">REQUERIDO OFICIAL</div>
                                <div class="wanted-name">${criminal.nombre}</div>
                            </div>
                        </div>`;
                });
            } catch (error) {
                document.getElementById('contenedor-buscados').innerHTML = `<div class="empty"><p style="color: var(--danger);">Error al conectar con la central criminal.</p></div>`;
            }
        }
        window.onload = cargarBuscados;
    </script>
</body>
</html>
