<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noticias - Fiscalía General de la Nación</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --blue-dark: #003366; --blue-light: #1d70b8; --bg-apple: #f5f5f7;
            --text-dark: #1d1d1f; --text-muted: #86868b; --white: #ffffff; --radius: 14px;        
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-apple); color: var(--text-dark); padding-top: 80px; min-height: 100vh; display: flex; flex-direction: column; }
        
        .navbar { background-color: rgba(0, 51, 102, 0.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); position: fixed; top: 0; width: 100%; z-index: 1000; border-bottom: 1px solid rgba(255, 255, 255, 0.1); }
        .nav-container { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; height: 54px; padding: 0 20px; }
        .logo { display: flex; align-items: center; gap: 12px; cursor: pointer; }
        .logo-img { height: 36px; border-radius: 4px; background-color: rgba(255, 255, 255, 0.9); padding: 2px; }
        .logo-text strong { color: var(--white); font-size: 15px; display: block; }
        .logo-text span { font-size: 9px; display: block; color: #cbd5e1; }
        .nav-menu { display: flex; list-style: none; gap: 28px; }
        .nav-menu a { color: #cbd5e1; text-decoration: none; font-size: 14px; padding: 4px 0; }
        .nav-menu a:hover, .nav-menu a.active { color: #38bdf8; }
        .btn-login { background-color: var(--white); color: var(--blue-dark); padding: 6px 16px; border-radius: 20px; text-decoration: none; font-size: 13px; font-weight: 500; }

        .container { max-width: 1200px; margin: 40px auto; padding: 0 20px; flex: 1; }
        .page-header { text-align: center; margin-bottom: 40px; }
        .page-title { font-size: 32px; font-weight: 700; color: var(--blue-dark); margin-bottom: 10px; }
        .page-subtitle { font-size: 16px; color: var(--text-muted); }
        
        /* Grid Principal */
        .news-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 24px; margin-top: 20px; }
        .news-card { background: var(--white); border-radius: var(--radius); padding: 30px; box-shadow: 0 4px 20px rgba(0,0,0,0.01); border: 1px solid rgba(0,0,0,0.03); display: flex; flex-direction: column; justify-content: space-between; position: relative; overflow: hidden; transition: transform 0.2s, box-shadow 0.2s; }
        .news-card:hover { transform: translateY(-4px); box-shadow: 0 8px 30px rgba(0,0,0,0.04); }
        .news-card::before { content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%; background: var(--blue-light); }
        
        .news-header { display: flex; gap: 14px; align-items: flex-start; margin-bottom: 16px; }
        .news-icon { color: var(--blue-light); font-size: 22px; background: #eef4fa; padding: 10px; border-radius: 10px; }
        .news-badge { display: inline-block; background: #eef4fa; color: var(--blue-light); font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 12px; margin-bottom: 6px; text-transform: uppercase; }
        .news-title { font-size: 17px; font-weight: 600; color: var(--text-dark); line-height: 1.4; }
        
        .news-footer { border-top: 1px solid #f2f2f7; margin-top: 16px; padding-top: 14px; display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--text-muted); }
        .read-more { color: var(--blue-light); font-weight: 500; display: flex; align-items: center; gap: 4px; cursor: pointer; background: none; border: none; font-size: 13px; }

        /* Vista Detallada de la Noticia */
        .single-news-view { display: none; background: var(--white); border-radius: var(--radius); padding: 40px; box-shadow: 0 4px 25px rgba(0,0,0,0.02); border: 1px solid rgba(0,0,0,0.03); max-width: 800px; margin: 0 auto; }
        .single-news-view.active { display: block; }
        .btn-back { background: #eef4fa; color: var(--blue-dark); border: none; padding: 8px 18px; border-radius: 20px; font-size: 14px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; margin-bottom: 24px; transition: 0.2s; }
        .btn-back:hover { background: #dce7f5; }
        .full-news-img { width: 100%; max-height: 400px; object-fit: cover; border-radius: 10px; margin: 20px 0; display: none; }
        .full-news-body { font-size: 16px; line-height: 1.7; color: #3a3a3c; white-space: pre-line; }

        .loading, .empty { text-align: center; padding: 60px 0; grid-column: 1 / -1; color: var(--text-muted); }
        .spinner { display: inline-block; width: 28px; height: 28px; border: 3px solid rgba(29, 112, 184, 0.1); border-radius: 50%; border-top-color: var(--blue-light); animation: spin 1s infinite; margin-bottom: 12px; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo" onclick="window.location.href='index.html'">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSXBKuX8mWSlLgU5WOYx5ODP9N8QM5debq5wTdzLVi4fFWk2M8IQsowaFI&s=10" class="logo-img">
                <div class="logo-text"><strong>FISCALÍA</strong><span>GENERAL DE LA NACIÓN</span></div>
            </div>
            <ul class="nav-menu">
                <li><a href="index.html">Inicio</a></li>
                <li><a href="buscados.html">Buscados</a></li>
                <li><a href="noticias.html" class="active">Noticias</a></li>
                <li><a href="denuncias.html">Denuncias</a></li>
            </ul>
            <a href="iniciar-sesion.html" class="btn-login">Acceder</a>
        </div>
    </nav>

    <div class="container">
        <!-- VISTA DE CUADRÍCULA GENERAL -->
        <div id="vista-lista-noticias">
            <div class="page-header">
                <h1 class="page-title">Boletines y Prensa Oficial</h1>
                <p class="page-subtitle">Comunicados e informativos emitidos por los despachos fiscales de la nación.</p>
            </div>
            <div class="news-grid" id="contenedor-noticias">
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Sincronizando comunicados oficiales...</p>
                </div>
            </div>
        </div>

        <!-- VISTA DETALLADA (OCULTA POR DEFECTO) -->
        <div id="vista-noticia-completa" class="single-news-view">
            <button class="btn-back" onclick="mostrarListaNoticias()"><i class="fa-solid fa-arrow-left"></i> Volver a las noticias</button>
            <span class="news-badge">Comunicado Oficial</span>
            <h1 id="full-news-title" class="page-title" style="text-align: left; margin-top: 10px; font-size: 28px;"></h1>
            <img id="full-news-image" class="full-news-img" src="" alt="Imagen Noticia">
            <p id="full-news-text" class="full-news-body"></p>
        </div>
    </div>

    <script>
        let noticiasCache = []; // Para guardar temporalmente las noticias cargadas de la API

        async function cargarNoticias() {
            try {
                const response = await fetch('/api/admin/data');
                const data = await response.json();
                noticiasCache = data.noticias; // Guardamos las noticias en memoria
                
                const contenedor = document.getElementById('contenedor-noticias');
                contenedor.innerHTML = '';

                if (noticiasCache.length === 0) {
                    contenedor.innerHTML = `
                        <div class="empty">
                            <i class="fa-solid fa-folder-open" style="font-size: 40px; color: #cbd5e1; margin-bottom: 12px;"></i>
                            <p>No se registran comunicados emitidos el día de hoy.</p>
                        </div>`;
                    return;
                }

                noticiasCache.forEach((noticia, index) => {
                    contenedor.innerHTML += `
                        <div class="news-card">
                            <div>
                                <div class="news-header">
                                    <i class="fa-solid fa-bullhorn news-icon"></i>
                                    <div>
                                        <span class="news-badge">Oficial</span>
                                        <h3 class="news-title">${noticia.titular}</h3>
                                    </div>
                                </div>
                            </div>
                            <div class="news-footer">
                                <span><i class="fa-regular fa-clock"></i> Reciente</span>
                                <button class="read-more" onclick="verNoticiaCompleta(${index})">Ver boletín <i class="fa-solid fa-chevron-right" style="font-size: 10px;"></i></button>
                            </div>
                        </div>`;
                });
            } catch (error) {
                document.getElementById('contenedor-noticias').innerHTML = `<div class="empty"><p style="color: #dc3545;">Error al cargar el canal de noticias.</p></div>`;
            }
        }

        // Función para abrir y leer una noticia entera
        function verNoticiaCompleta(index) {
            const noticia = noticiasCache[index];
            if(!noticia) return;

            document.getElementById('full-news-title').innerText = noticia.titular;
            
            // Si la noticia tiene descripción, la pone; si no, deja un mensaje de relleno informativo
            document.getElementById('full-news-text').innerText = noticia.descripcion || "No se ha anexado descripción ampliada para este boletín de prensa judicial.";
            
            // Manejo dinámico de imagen opcional
            const imgElement = document.getElementById('full-news-image');
            if (noticia.imagen && noticia.imagen.trim() !== "") {
                imgElement.src = noticia.imagen;
                imgElement.style.display = "block";
            } else {
                imgElement.style.display = "none";
            }

            // Transición de vistas
            document.getElementById('vista-lista-noticias').style.display = "none";
            document.getElementById('vista-noticia-completa').classList.add('active');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Función para regresar a la normalidad
        function mostrarListaNoticias() {
            document.getElementById('vista-noticia-completa').classList.remove('active');
            document.getElementById('vista-lista-noticias').style.display = "block";
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        window.onload = cargarNoticias;
    </script>
</body>
</html>
