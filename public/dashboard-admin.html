<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin - Fiscalía</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        body { background-color: #f5f5f7; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .sidebar { background-color: #003366; min-height: 100vh; color: white; position: fixed; width: 240px; }
        .sidebar a { color: #cbd5e1; text-decoration: none; display: block; padding: 14px 20px; font-size: 14px; transition: 0.2s; cursor: pointer; }
        .sidebar a:hover, .sidebar a.active { background-color: #1d70b8; color: white; border-left: 4px solid #38bdf8; }
        .main-content { margin-left: 240px; padding: 24px; }
        .card-custom { border: none; border-radius: 14px; box-shadow: 0 4px 20px rgba(0,0,0,0.02); background: white; margin-bottom: 25px; border: 1px solid rgba(0,0,0,0.03); }
        .tab-content-panel { display: none; }
        .tab-content-panel.active { display: block; }
    </style>
</head>
<body>

    <div class="sidebar shadow-sm">
        <div class="p-4 text-center border-bottom border-secondary border-opacity-25">
            <h5 class="fw-bold m-0"><i class="fa-solid fa-user-shield me-2 text-info"></i>ADMIN FISCALÍA</h5>
        </div>
        <div class="py-3">
            <a onclick="switchTab('consola')" id="link-consola" class="active"><i class="fa-solid fa-chart-line me-2"></i>Inicio</a>
            <a onclick="switchTab('usuarios')" id="link-usuarios"><i class="fa-solid fa-users me-2"></i>Usuarios</a>
            <a onclick="switchTab('noticias')" id="link-noticias"><i class="fa-solid fa-bullhorn me-2"></i>Noticias</a>
            <a onclick="switchTab('buscados')" id="link-buscados"><i class="fa-solid fa-gavel me-2"></i>Buscados</a>
            <a onclick="switchTab('denuncias')" id="link-denuncias"><i class="fa-solid fa-folder-open me-2"></i>Denuncias</a>
        </div>
    </div>

    <div class="main-content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h4 id="display-username" class="fw-bold">Hola, Admin</h4>
            <button class="btn btn-danger btn-sm" onclick="cerrarSesion()">Cerrar Sesión</button>
        </div>

        <div id="tab-consola" class="tab-content-panel active">
            <div class="card card-custom p-5 text-center">
                <h2>Centro de Operaciones</h2>
                <p>Bienvenido al panel de control superior de la Fiscalía.</p>
            </div>
        </div>

        <!-- USUARIOS -->
        <div id="tab-usuarios" class="tab-content-panel">
            <div class="card card-custom p-4">
                <h5>Gestión de Usuarios</h5>
                <table class="table">
                    <thead><tr><th>Usuario</th><th>Rol</th><th>Acción</th></tr></thead>
                    <tbody id="tabla-usuarios"></tbody>
                </table>
            </div>
        </div>

        <!-- DENUNCIAS ADMIN -->
        <div id="tab-denuncias" class="tab-content-panel">
            <div class="card card-custom p-4">
                <h5>Denuncias Ciudadanas Recibidas</h5>
                <div id="lista-denuncias-admin"></div>
            </div>
        </div>

        <!-- MODAL GESTIONAR ESTADO -->
        <div class="modal fade" id="modalEstado" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header"><h5>Gestionar Denuncia</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
                    <div class="modal-body">
                        <input type="hidden" id="denuncia-id-actual">
                        <label>Nuevo Estado / Mensaje:</label>
                        <textarea id="nuevo-estado-mensaje" class="form-control mb-3" placeholder="Ej: La denuncia está siendo analizada por el equipo judicial..."></textarea>
                        <button class="btn btn-primary w-100" onclick="guardarEstado()">Actualizar Estado</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- NOTICIAS Y BUSCADOS (Igual que antes pero integrados) -->
        <div id="tab-noticias" class="tab-content-panel">...</div>
        <div id="tab-buscados" class="tab-content-panel">...</div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const user = JSON.parse(localStorage.getItem('currentUser'));
        if (!user || user.role !== 'admin') window.location.href = 'iniciar-sesion.html';
        document.getElementById('display-username').innerText = `Hola, ${user.username}`;

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content-panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.sidebar a').forEach(l => l.classList.remove('active'));
            document.getElementById('tab-' + tabId).classList.add('active');
            document.getElementById('link-' + tabId).classList.add('active');
        }

        async function cargarDatos() {
            const res = await fetch('/api/admin/data');
            const data = await res.json();

            // Usuarios
            const tU = document.getElementById('tabla-usuarios');
            tU.innerHTML = '';
            data.users.forEach(u => {
                tU.innerHTML += `<tr><td>${u.username}</td><td>${u.role}</td><td>
                    ${u.role === 'user' ? `<button class="btn btn-sm btn-success" onclick="hacerAdmin('${u.username}')">Ascender</button>` : ''}
                    <button class="btn btn-sm btn-danger" onclick="eliminarUsuario('${u.username}')">X</button>
                </td></tr>`;
            });

            // Denuncias
            const lD = document.getElementById('lista-denuncias-admin');
            lD.innerHTML = '';
            data.denuncias.forEach(d => {
                lD.innerHTML += `<div class="card mb-2 p-3 border">
                    <h6><strong>${d.titulo}</strong> <span class="badge bg-warning text-dark">${d.estado_actual}</span></h6>
                    <p class="small text-muted mb-1">Por: ${d.usuario} | ${d.fecha}</p>
                    <p>${d.descripcion}</p>
                    <button class="btn btn-sm btn-primary" onclick="abrirGestion(${d.id})">Gestionar Denuncia</button>
                </div>`;
            });
        }

        function abrirGestion(id) {
            document.getElementById('denuncia-id-actual').value = id;
            new bootstrap.Modal(document.getElementById('modalEstado')).show();
        }

        async function guardarEstado() {
            const id = document.getElementById('denuncia-id-actual').value;
            const mensaje = document.getElementById('nuevo-estado-mensaje').value;
            const fecha = new Date().toLocaleString();
            
            const res = await fetch('/api/admin/actualizar-estado', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ denuncia_id: id, mensaje, fecha })
            });

            if(res.ok) {
                alert("Estado actualizado.");
                location.reload();
            }
        }

        function cerrarSesion() { localStorage.clear(); window.location.href = 'iniciar-sesion.html'; }
        window.onload = cargarDatos;
    </script>
</body>
</html>
