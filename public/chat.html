<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>DevHub | Chat</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { display: flex; height: 100vh; background: #fff; color: #1d1d1f; }

        /* LISTA DE AMIGOS (SIDEBAR IZQUIERDO) */
        .friends-list {
            width: 320px;
            border-right: 1px solid #d2d2d7;
            display: flex;
            flex-direction: column;
            background: #fbfbfd;
        }

        .chat-header {
            padding: 25px;
            border-bottom: 1px solid #d2d2d7;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .friends-scroll { flex: 1; overflow-y: auto; padding: 10px; }

        .friend-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 12px;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.2s;
            margin-bottom: 5px;
        }

        .friend-item:hover { background: rgba(0, 113, 227, 0.05); }
        .friend-item.active { background: #e8f3ff; }

        .avatar {
            width: 45px; height: 45px;
            border-radius: 50%;
            background: #d2d2d7;
            display: flex; justify-content: center; align-items: center;
            font-weight: 600; color: white;
            position: relative;
        }

        .status-dot {
            width: 12px; height: 12px;
            background: #34c759;
            border: 2px solid #fff;
            border-radius: 50%;
            position: absolute; bottom: 0; right: 0;
        }

        /* ÁREA DE CHAT */
        .chat-view { flex: 1; display: flex; flex-direction: column; background: #fff; }

        .chat-banner { padding: 20px 30px; border-bottom: 1px solid #d2d2d7; display: flex; align-items: center; gap: 15px; }

        .messages-container { flex: 1; padding: 30px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }

        .msg { max-width: 70%; padding: 12px 18px; border-radius: 18px; font-size: 15px; line-height: 1.4; }
        .msg-received { background: #f2f2f7; align-self: flex-start; border-bottom-left-radius: 4px; }
        .msg-sent { background: #0071e3; color: white; align-self: flex-end; border-bottom-right-radius: 4px; }

        .input-area { padding: 25px 30px; border-top: 1px solid #d2d2d7; }
        .input-wrapper {
            background: #f5f5f7;
            border-radius: 25px;
            padding: 8px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        input { flex: 1; border: none; background: transparent; padding: 10px 0; outline: none; font-size: 16px; }

        .btn-add {
            background: #0071e3; color: white; border: none; padding: 8px 15px; border-radius: 8px; cursor: pointer; font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="friends-list">
        <div class="chat-header">
            <h2 style="font-size: 20px;">Chats</h2>
            <button class="btn-add">+ Amigo</button>
        </div>
        <div class="friends-scroll">
            <div class="friend-item active">
                <div class="avatar" style="background: #5856d6;">JD <div class="status-dot"></div></div>
                <div>
                    <p style="font-weight: 600;">Juan Dev</p>
                    <p style="font-size: 12px; color: #86868b;">¿Cómo va el código?</p>
                </div>
            </div>
            <div class="friend-item">
                <div class="avatar" style="background: #ff9500;">AL</div>
                <div>
                    <p style="font-weight: 600;">Alex L.</p>
                    <p style="font-size: 12px; color: #86868b;">Visto hace 5m</p>
                </div>
            </div>
        </div>
    </div>

    <div class="chat-view">
        <div class="chat-banner">
            <div class="avatar" style="width: 35px; height: 35px; background: #5856d6; font-size: 12px;">JD</div>
            <p style="font-weight: 600;">Juan Dev</p>
        </div>

        <div class="messages-container" id="chatBox">
            <div class="msg msg-received">¡Hola! Qué bueno verte por aquí.</div>
            <div class="msg msg-sent">Gracias Juan. Estamos probando la plataforma.</div>
            <div class="msg msg-received">Se ve genial, el diseño Apple le queda muy bien.</div>
        </div>

        <div class="input-area">
            <div class="input-wrapper">
                <input type="text" id="msgInput" placeholder="Escribe un mensaje...">
                <button onclick="enviar()" style="border:none; background:none; color:#0071e3; font-weight:600; cursor:pointer;">Enviar</button>
            </div>
        </div>
    </div>

    <script>
        function enviar() {
            const input = document.getElementById('msgInput');
            if(input.value.trim() === "") return;
            
            const box = document.getElementById('chatBox');
            const div = document.createElement('div');
            div.className = "msg msg-sent";
            div.innerText = input.value;
            box.appendChild(div);
            
            input.value = "";
            box.scrollTop = box.scrollHeight;
        }
    </script>
</body>
</html>
