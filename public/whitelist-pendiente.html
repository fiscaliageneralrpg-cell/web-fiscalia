<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Whitelist pendiente | Medellín RP</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #06141f, #0a3140);
        color: #f4efe3;
        font-family: Inter, system-ui, sans-serif;
      }
      .card {
        width: min(560px, calc(100% - 36px));
        padding: 42px 30px;
        text-align: center;
        border: 1px solid #42d8d044;
        border-radius: 24px;
        background: linear-gradient(145deg, #102b42f5, #071b2bf5);
        box-shadow: 0 25px 70px #0008, inset 0 1px #ffffff12;
      }
      .icon {
        display: grid;
        width: 76px;
        height: 76px;
        margin: 0 auto 18px;
        place-items: center;
        border: 1px solid #42d8d066;
        border-radius: 22px;
        background: #42d8d018;
        color: #42d8d0;
        font-size: 48px;
      }
      h1 {
        letter-spacing: -0.04em;
      }
      p {
        color: #a9bac6;
        line-height: 1.6;
      }
      .btn {
        display: inline-block;
        margin-top: 18px;
        padding: 13px 18px;
        border-radius: 10px;
        background: #42d8d0;
        color: #06141f;
        text-decoration: none;
        font-weight: 800;
      }
      #estado {
        margin-top: 18px;
        color: #a9bac6;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="icon">⏳</div>
      <h1>Whitelist en revisión</h1>
      <p>
        Tu solicitud fue enviada correctamente. El equipo de Medellín RP la
        revisará. Esta página comprobará automáticamente cuando exista una
        respuesta.
      </p>
      <div id="estado">Comprobando estado...</div>
      <a class="btn" href="/cerrar-sesion">Cerrar sesión</a>
    </main>
    <script>
      async function comprobarEstado() {
        try {
          const respuesta = await fetch("/api/whitelist/status", {
            cache: "no-store",
          });

          if (!respuesta.ok) return;

          const datos = await respuesta.json();

          if (datos.redirect) {
            window.location.href = datos.redirect;
            return;
          }

          document.querySelector("#estado").textContent =
            "La solicitud continúa pendiente de revisión.";
        } catch (error) {
          document.querySelector("#estado").textContent =
            "Esperando conexión con el servidor...";
        }
      }

      comprobarEstado();
      setInterval(comprobarEstado, 5000);
    </script>
  </body>
</html>
