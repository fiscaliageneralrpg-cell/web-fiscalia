<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Whitelist pendiente | Medellín RP</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #07101d;
        color: #f4f7fb;
        font-family: system-ui, sans-serif;
      }
      .card {
        width: min(560px, calc(100% - 36px));
        padding: 42px 30px;
        text-align: center;
        border: 1px solid #ffffff1c;
        border-radius: 24px;
        background: #102238;
      }
      .icon {
        font-size: 48px;
      }
      h1 {
        letter-spacing: -0.04em;
      }
      p {
        color: #aebbd0;
        line-height: 1.6;
      }
      .btn {
        display: inline-block;
        margin-top: 18px;
        padding: 13px 18px;
        border-radius: 10px;
        background: #ffd166;
        color: #07101d;
        text-decoration: none;
        font-weight: 800;
      }
      #estado {
        margin-top: 18px;
        color: #aebbd0;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="icon">⏳</div>
      <h1>Whitelist en revisión</h1>
      <p>
        Tu solicitud fue enviada correctamente. El equipo de Medellín RP la
        revisará. Esta página comprobará automáticamente cuando exista una
        respuesta.
      </p>
      <div id="estado">Comprobando estado...</div>
      <a class="btn" href="/cerrar-sesion">Cerrar sesión</a>
    </main>
    <script>
      async function comprobarEstado() {
        try {
          const respuesta = await fetch("/api/whitelist/status", {
            cache: "no-store",
          });

          if (!respuesta.ok) return;

          const datos = await respuesta.json();

          if (datos.redirect) {
            window.location.href = datos.redirect;
            return;
          }

          document.querySelector("#estado").textContent =
            "La solicitud continúa pendiente de revisión.";
        } catch (error) {
          document.querySelector("#estado").textContent =
            "Esperando conexión con el servidor...";
        }
      }

      comprobarEstado();
      setInterval(comprobarEstado, 5000);
    </script>
  </body>
</html>
