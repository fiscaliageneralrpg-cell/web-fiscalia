<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Whitelist pendiente | Medellín RP</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #07101d;
        color: #f4f7fb;
        font-family: system-ui, sans-serif;
      }
      .card {
        width: min(560px, calc(100% - 36px));
        padding: 42px 30px;
        text-align: center;
        border: 1px solid #ffffff1c;
        border-radius: 24px;
        background: #102238;
      }
      .icon {
        font-size: 48px;
      }
      h1 {
        letter-spacing: -0.04em;
      }
      p {
        color: #aebbd0;
        line-height: 1.6;
      }
      .btn {
        display: inline-block;
        margin-top: 18px;
        padding: 13px 18px;
        border-radius: 10px;
        background: #ffd166;
        color: #07101d;
        text-decoration: none;
        font-weight: 800;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="icon">⏳</div>
      <h1>Whitelist en revisión</h1>
      <p>
        Tu solicitud fue enviada correctamente. El equipo de Medellín RP la
        revisará. Vuelve a iniciar sesión más adelante para continuar.
      </p>
      <a class="btn" href="/cerrar-sesion">Cerrar sesión</a>
    </main>
  </body>
</html>
