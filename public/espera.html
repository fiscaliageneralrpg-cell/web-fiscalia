<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Solicitud Enviada | Sistema</title>
    <style>
        body {
            background: #0b0e11;
            color: white;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .loader-card {
            background: #15191d;
            padding: 50px;
            border-radius: 20px;
            border: 1px solid #333;
            max-width: 500px;
        }
        .spinner {
            width: 60px;
            height: 60px;
            border: 5px solid rgba(0, 170, 255, 0.1);
            border-top: 5px solid #00AAFF;
            border-radius: 50%;
            margin: 0 auto 30px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        h2 { color: #00AAFF; margin-bottom: 15px; }
        p { color: #aaa; line-height: 1.6; }
        .btn-check {
            margin-top: 30px;
            display: inline-block;
            padding: 12px 25px;
            background: #333;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            transition: background 0.3s;
        }
        .btn-check:hover { background: #444; }
    </style>
</head>
<body>
    <div class="loader-card">
        <div class="spinner"></div>
        <h2>SOLICITUD EN REVISIÓN</h2>
        <p>Hemos enviado tus datos al canal de administración. Un miembro del staff revisará tu perfil y te asignará el rango correspondiente en Discord.</p>
        <p><small>Una vez que recibas el rol, podrás acceder a las secciones del Dashboard.</small></p>
        <a href="/dashboard.html" class="btn-check">VERIFICAR ESTADO</a>
    </div>
</body>
</html>
