<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Mis vehículos | Medellín RP</title>
  <link rel="icon" type="image/png" sizes="192x192" href="/favicon.png" />
  <style>
    :root{
      --bg:#0a0a0a;--panel:rgba(20,20,20,.72);--line:rgba(255,255,255,.10);--line2:rgba(255,255,255,.18);
      --text:#fff;--muted:#a1a1a1;--accent:#d4d4d4;--cyan:#74e6ff;--red:#ef7777;--shadow:0 30px 100px rgba(0,0,0,.6)
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;min-height:100vh;color:var(--text);background:var(--bg);font-family:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:hidden}
    body::before{content:"";position:fixed;inset:0;z-index:-2;background:radial-gradient(circle at 30% 20%,rgba(255,255,255,.06),transparent 40%),radial-gradient(circle at 80% 80%,rgba(255,255,255,.04),transparent 40%);background-size:200% 200%;animation:fondoMover 20s ease infinite}
    @keyframes fondoMover{0%,100%{background-position:0 0}50%{background-position:100% 100%}}
    @keyframes aparecer{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
    @keyframes flotar{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

    .wrap{width:min(1050px,calc(100% - 30px));margin:28px auto 60px;animation:aparecer .9s ease both}
    .top{display:flex;justify-content:space-between;gap:16px;align-items:center}
    .top strong{letter-spacing:-.02em}
    .top a{color:var(--muted);text-decoration:none;font-weight:700;font-size:13px;transition:color .2s}
    .top a:hover{color:#fff}

    .hero{margin-top:22px;padding:34px;border:1px solid var(--line);border-radius:24px;background:linear-gradient(135deg,rgba(0,0,0,.55),rgba(255,255,255,.04)),var(--panel);backdrop-filter:blur(20px);box-shadow:var(--shadow)}
    .kicker{display:inline-flex;align-items:center;gap:8px;color:var(--accent);font-size:11px;font-weight:800;letter-spacing:.2em;text-transform:uppercase}
    .kicker::before{content:"";width:30px;height:1px;background:var(--accent)}
    .hero h1{margin:12px 0 8px;font-size:clamp(30px,5vw,54px);line-height:1.05;letter-spacing:-.04em;font-weight:900}
    .hero p{margin:0;color:#b3b3b3;line-height:1.6;font-size:15px}
    .hero::after{content:"❄️ ¡Feliz Navidad, Medellín RP! 🎄";display:inline-flex;margin-top:18px;padding:9px 18px;border:1px solid rgba(116,230,255,.35);border-radius:999px;background:rgba(76,164,255,.12);color:var(--cyan);font-size:13px;font-weight:800;letter-spacing:.04em;animation:flotar 4.5s ease-in-out infinite}

    .bar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:0;flex-wrap:wrap}
    .bar h2{margin:0;font-size:22px;font-weight:800;letter-spacing:-.03em}
    .panel{padding:22px;border:1px solid var(--line);border-radius:20px;background:var(--panel);backdrop-filter:blur(20px);box-shadow:0 12px 35px rgba(0,0,0,.35)}

    .form{display:grid;grid-template-columns:1fr;gap:12px;margin-bottom:6px}
    .field label{display:block;margin-bottom:6px;color:var(--muted);font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.05em}
    .field select,.field input{width:100%;padding:12px 13px;border:1px solid var(--line2);border-radius:12px;color:#fff;background:rgba(0,0,0,.35);font:inherit;transition:border-color .2s,background .2s}
    .field select:focus,.field input:focus{outline:none;border-color:rgba(255,255,255,.5);background:rgba(0,0,0,.5)}
    .field select option{background:#141414;color:#fff}

    .button{padding:12px 16px;border:1px solid #fff;border-radius:12px;color:#0a0a0a;background:#fff;font-weight:800;cursor:pointer;transition:all .3s ease}
    .button:hover{transform:translateY(-2px);background:#e5e5e5;box-shadow:0 12px 30px rgba(255,255,255,.15)}
    .button:active{transform:scale(.97)}
    .button.danger{color:#ffb5b5;background:rgba(239,68,68,.18);border-color:rgba(239,68,68,.5)}
    .button.danger:hover{background:rgba(239,68,68,.32);box-shadow:none}
    .button.secondary{color:#fff;background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.15)}
    .button.secondary:hover{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.4);box-shadow:none}
    .button:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}

    .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:16px}
    .vehicle{display:flex;justify-content:space-between;align-items:center;gap:15px;padding:17px;border:1px solid var(--line);border-radius:14px;background:rgba(0,0,0,.25);transition:transform .2s,border-color .2s}
    .vehicle:hover{transform:translateY(-2px);border-color:var(--line2)}
    .vehicle h3{margin:0 0 7px}
    .vehicle p{margin:3px 0;color:var(--muted);font-size:13px}
    .vehicle strong{color:#fff}
    .empty,.status{color:var(--muted);font-size:14px}
    .empty{grid-column:1/-1;padding:20px;text-align:center;border:1px dashed var(--line2);border-radius:14px}
    .pager{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:18px}
    .message{min-height:20px;margin:12px 0 0;color:var(--cyan);font-weight:800}

    .modal{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:20px;background:rgba(0,0,0,.75);backdrop-filter:blur(6px)}
    .modal[hidden]{display:none}
    .modal-card{width:min(540px,100%);padding:24px;border:1px solid var(--line2);border-radius:22px;background:rgba(20,20,20,.95);box-shadow:0 25px 90px rgba(0,0,0,.8);animation:aparecer .3s ease both}
    .modal-head{display:flex;justify-content:space-between;align-items:center;gap:15px}
    .modal-head h2{margin:0}
    .close{border:1px solid var(--line2);border-radius:10px;padding:4px 12px;color:#fff;background:rgba(255,255,255,.06);font-size:22px;cursor:pointer;transition:background .2s}
    .close:hover{background:rgba(255,255,255,.15)}
    .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:6px}

    /* Nieve */
    #nieve{position:fixed;inset:0;z-index:40;pointer-events:none;overflow:hidden}
    .copo{position:absolute;top:-24px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#fff,#cfe4ff);box-shadow:0 0 8px rgba(255,255,255,.8);animation:caerNieve linear infinite}
    @keyframes caerNieve{0%{transform:translate3d(0,-6vh,0) rotate(0)}100%{transform:translate3d(var(--der,0px),108vh,0) rotate(360deg)}}

    @media(max-width:700px){.grid{grid-template-columns:1fr}.vehicle{align-items:flex-start;flex-direction:column}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
<div id="nieve" aria-hidden="true"></div>
<main class="wrap">
  <div class="top"><strong>「ME:RP」Medellín RP︱ER:LC</strong><a href="/ciudadano.html">← Volver a ciudadano</a></div>
  <header class="hero"><div class="kicker">Registro automotor digital</div><h1>Mis vehículos</h1><p>Solo puedes registrar vehículos que tengas en tu inventario.</p></header>
  <section class="panel" style="margin-top:18px"><div class="bar"><button id="abrir-modal" class="button" type="button">＋ Registrar vehículo</button><span id="contador" class="status">Cargando...</span></div></section>
  <div id="modal-registro" class="modal" hidden>
    <section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="titulo-modal">
      <div class="modal-head"><h2 id="titulo-modal">🚘 Registrar vehículo</h2><button id="cerrar-modal" class="close" type="button" aria-label="Cerrar">×</button></div>
      <p class="status">Elige un vehículo de tu inventario y escribe su placa.</p>
      <form id="formulario" class="form">
        <div class="field"><label for="item">Vehículo disponible</label><select id="item" required><option value="">Cargando inventario...</option></select></div>
        <div class="field"><label for="placa">Placa</label><input id="placa" maxlength="10" placeholder="ABC123" required></div>
        <div class="modal-actions"><button id="cancelar-modal" class="button secondary" type="button">Cancelar</button><button class="button" type="submit">Registrar</button></div>
      </form>
      <div id="mensaje" class="message"></div>
    </section>
  </div>
  <section class="panel" style="margin-top:18px"><div class="bar"><h2>🚗 Vehículos registrados</h2></div><div id="lista" class="grid"><div class="empty">Cargando vehículos...</div></div><div class="pager"><button id="anterior" class="button secondary" type="button">← Anterior</button><span id="pagina" class="status">Página 1</span><button id="siguiente" class="button secondary" type="button">Siguiente →</button></div></section>
</main>
<script>
  const porPagina = 5;
  const estado = {vehiculos:[],inventario:[],pagina:1};
  const $ = (selector) => document.querySelector(selector);
  function mensaje(texto, error=false){ $("#mensaje").textContent=texto; $("#mensaje").style.color=error?"#ff8b8b":"#74e6ff"; }
  function pintarInventario(){
    const select=$("#item"); select.textContent="";
    const disponibles=estado.inventario.filter((item)=>item?.tipo==="vehiculo" && !estado.vehiculos.some((v)=>String(v.itemId)===String(item.itemId)));
    if(!disponibles.length){select.innerHTML='<option value="">No tienes vehículos disponibles</option>',$('#formulario button[type="submit"]').disabled=true;return;}
    select.innerHTML='<option value="">Selecciona un vehículo</option>'+disponibles.map((item)=>`<option value="${item.itemId}">${item.emoji||"🚗"} ${item.nombre}</option>`).join("");
    $('#formulario button[type="submit"]').disabled=false;
  }
  function abrirModal(){ $("#modal-registro").hidden=false; pintarInventario(); $("#item").focus(); }
  function cerrarModal(){ $("#modal-registro").hidden=true; mensaje(""); }
  function pintar(){
    const total=Math.max(1,Math.ceil(estado.vehiculos.length/porPagina));estado.pagina=Math.min(estado.pagina,total);const inicio=(estado.pagina-1)*porPagina;const lista=estado.vehiculos.slice(inicio,inicio+porPagina);$("#lista").textContent="";
    if(!lista.length){$("#lista").innerHTML='<div class="empty">No tienes vehículos registrados.</div>';}else lista.forEach((v)=>{const card=document.createElement("article");card.className="vehicle";card.innerHTML=`<div><h3>🚘 ${v.modelo||"Vehículo"}</h3><p>Placa: <strong>${v.placa||"Sin placa"}</strong></p><p>Registrado: ${v.registradoEn?new Date(v.registradoEn).toLocaleDateString("es-CO"):"Sin fecha"}</p></div><button class="button danger" data-eliminar="${v.id}" type="button">Eliminar</button>`;$("#lista").appendChild(card);});
    $("#pagina").textContent=`Página ${estado.pagina} de ${total}`;$("#anterior").disabled=estado.pagina<=1;$("#siguiente").disabled=estado.pagina>=total;$("#contador").textContent=`${estado.vehiculos.length} registrado(s)`;pintarInventario();
  }
  async function cargar(){const respuesta=await fetch("/api/vehiculos",{cache:"no-store"});if(respuesta.status===401){location.href="/iniciar-seccion.html";return;}const datos=await respuesta.json();if(!respuesta.ok)throw new Error(datos.error||"No se pudieron cargar los vehículos.");estado.vehiculos=datos.vehiculos||[];estado.inventario=datos.inventario||[];pintar();}
  $("#abrir-modal").addEventListener("click",abrirModal);$("#cerrar-modal").addEventListener("click",cerrarModal);$("#cancelar-modal").addEventListener("click",cerrarModal);$("#modal-registro").addEventListener("click",(e)=>{if(e.target.id==="modal-registro")cerrarModal();});
  $("#formulario").addEventListener("submit",async(e)=>{e.preventDefault();mensaje("Registrando...");const respuesta=await fetch("/api/vehiculos",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({itemId:$("#item").value,placa:$("#placa").value})});const datos=await respuesta.json();if(!respuesta.ok){mensaje(datos.error||"No se pudo registrar.",true);return;}$("#placa").value="";cerrarModal();await cargar();});
  $("#lista").addEventListener("click",async(e)=>{const boton=e.target.closest("[data-eliminar]");if(!boton)return;if(!confirm("¿Eliminar este vehículo registrado?"))return;const respuesta=await fetch(`/api/vehiculos/${encodeURIComponent(boton.dataset.eliminar)}`,{method:"DELETE"});const datos=await respuesta.json();if(!respuesta.ok){mensaje(datos.error||"No se pudo eliminar.",true);return;}mensaje("Vehículo eliminado.");await cargar();});
  $("#anterior").onclick=()=>{estado.pagina--;pintar()};$("#siguiente").onclick=()=>{estado.pagina++;pintar()};cargar().catch((error)=>mensaje(error.message,true));
</script>
<script>
  (function () {
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const contenedor = document.getElementById("nieve");
    const total = window.innerWidth < 760 ? 26 : 60;
    for (let i = 0; i < total; i++) {
      const copo = document.createElement("span");
      copo.className = "copo";
      const t = 3 + Math.random() * 7;
      copo.style.width = t + "px";
      copo.style.height = t + "px";
      copo.style.left = Math.random() * 100 + "%";
      copo.style.opacity = 0.35 + Math.random() * 0.6;
      copo.style.setProperty("--der", Math.random() * 120 - 60 + "px");
      copo.style.animationDuration = 9 + Math.random() * 14 + "s";
      copo.style.animationDelay = -Math.random() * 20 + "s";
      contenedor.appendChild(copo);
    }
  })();
</script>
</body>
</html>
