<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Institucional - Fiscalía General de la Nación</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --blue-dark: #003366; --blue-light: #1d70b8; --bg-apple: #f5f5f7;
            --text-dark: #1d1d1f; --text-muted: #86868b; --white: #ffffff; --radius: 14px;            
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-apple); color: var(--text-dark); padding-top: 80px; min-height: 100vh; display: flex; flex-direction: column; }
        
        .navbar { background-color: rgba(0, 51, 102, 0.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); position: fixed; top: 0; width: 100%; z-index: 1000; border-bottom: 1px solid rgba(255, 255, 255, 0.1); }
        .nav-container { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; height: 54px; padding: 0 20px; }
        .logo { display: flex; align-items: center; gap: 12px; cursor: pointer; }
        .logo-img { height: 36px; border-radius: 4px; background-color: rgba(255, 255, 255, 0.9); padding: 2px; }
        .logo-text strong { color: var(--white); font-size: 15px; display: block; }
        .logo-text span { font-size: 9px; display: block; color: #cbd5e1; }
        .nav-menu { display: flex; list-style: none; gap: 28px; }
        .nav-menu a { color: #cbd5e1; text-decoration: none; font-size: 14px; padding: 4px 0; }
        .nav-menu a:hover { color: #38bdf8; }
        .btn-login { background-color: rgba(255, 255, 255, 0.2); color: var(--white); padding: 6px 16px; border-radius: 20px; text-decoration: none; font-size: 13px; font-weight: 500; border: 1px solid rgba(255,255,255,0.3); }

        .auth-container { max-width: 420px; width: 100%; margin: auto; padding: 20px; animation: fadeIn 0.5s ease; }
        .auth-card { background: var(--white); padding: 40px 35px; border-radius: var(--radius); box-shadow: 0 10px 30px rgba(0,0,0,0.04); border: 1px solid rgba(0,0,0,0.02); text-align: center; }
        .auth-logo { height: 60px; margin-bottom: 20px; }
        .auth-card h2 { font-size: 24px; color: var(--blue-dark); font-weight: 700; margin-bottom: 8px; }
        .auth-card p { color: var(--text-muted); font-size: 14px; margin-bottom: 30px; }

        .auth-tabs { display: flex; background: #e8e8ed; padding: 4px; border-radius: 10px; margin-bottom: 25px; }
        .tab-btn { flex: 1; border: none; background: none; padding: 8px; font-size: 14px; font-weight: 600; color: var(--text-muted); border-radius: 8px; cursor: pointer; transition: all 0.2s ease; }
        .tab-btn.active { background: var(--white); color: var(--blue-dark); box-shadow: 0 2px 6px rgba(0,0,0,0.1); }

        .auth-form { display: none; text-align: left; }
        .auth-form.active { display: block; }
        
        .input-group { margin-bottom: 18px; position: relative; }
        .input-group i { position: absolute; left: 15px; top: 38px; color: #a1a1a6; font-size: 16px; }
        .input-group label { display: block; font-size: 12px; font-weight: 600; color: var(--text-dark); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
        .input-group input { width: 100%; padding: 12px 16px 12px 42px; border-radius: 10px; border: 1px solid #d2d2d7; background: #f5f5f7; font-size: 15px; transition: all 0.2s ease; outline: none; }
        .input-group input:focus { border-color: var(--blue-light); background: var(--white); box-shadow: 0 0 0 4px rgba(29, 112, 184, 0.1); }

        .btn-submit { width: 100%; background: linear-gradient(135deg, var(--blue-dark), var(--blue-light)); color: var(--white); border: none; padding: 14px; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 10px; transition: all 0.2s ease; box-shadow: 0 4px 12px rgba(29, 112, 184, 0.2); }
        .btn-submit:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(29, 112, 184, 0.3); }

        footer { text-align: center; padding: 30px 20px; color: var(--text-muted); font-size: 13px; margin-top: auto; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="nav-container">
            <div class="logo" onclick="window.location.href='index.html'">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSXBKuX8mWSlLgU5WOYx5ODP9N8QM5debq5wTdzLVi4fFWk2M8IQsowaFI&s=10" class="logo-img">
                <div class="logo-text"><strong>FISCALÍA</strong><span>GENERAL DE LA NACIÓN</span></div>
            </div>
            <ul class="nav-menu">
                <li><a href="index.html">Inicio</a></li>
                <li><a href="buscados.html">Buscados</a></li>
                <li><a href="noticias.html">Noticias</a></li>
                <li><a href="denuncias.html">Denuncias</a></li>
            </ul>
            <a href="iniciar-sesion.html" class="btn-login">Acceder</a>
        </div>
    </nav>

    <div class="auth-container">
        <div class="auth-card">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSXBKuX8mWSlLgU5WOYx5ODP9N8QM5debq5wTdzLVi4fFWk2M8IQsowaFI&s=10" class="auth-logo" alt="Fiscalía Escudo">
            <h2>Portal de Validación</h2>
            <p>Sectores y servicios de la Fiscalía General.</p>

            <div class="auth-tabs">
                <button id="tab-login" class="tab-btn active" onclick="switchTab('login')">Iniciar Sesión</button>
                <button id="tab-register" class="tab-btn" onclick="switchTab('register')">Crear Cuenta</button>
            </div>

            <form id="loginForm" class="auth-form active" onsubmit="handleLogin(event)">
                <div class="input-group">
                    <label>Usuario / Correo</label>
                    <i class="fa-solid fa-user"></i>
                    <input type="text" id="loginUser" placeholder="Tu correo o usuario" required>
                </div>
                <div class="input-group">
                    <label>Contraseña</label>
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="loginPass" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-submit">Ingresar al Sistema</button>
            </form>

            <form id="registerForm" class="auth-form" onsubmit="handleRegister(event)">
                <div class="input-group">
                    <label>Usuario / Correo</label>
                    <i class="fa-solid fa-user"></i>
                    <input type="text" id="regUser" placeholder="Crea tu usuario o correo" required>
                </div>
                <div class="input-group">
                    <label>Contraseña</label>
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="regPass" placeholder="Crea tu contraseña" required>
                </div>
                <button type="submit" class="btn-submit">Registrar Cuenta</button>
            </form>

        </div>
    </div>

    <footer>
        <p>&copy; 2026 Fiscalía General de la Nación - Servidor RP Colombia.</p>
    </footer>

    <script>
        function switchTab(type) {
            const tabLogin = document.getElementById('tab-login');
            const tabRegister = document.getElementById('tab-register');
            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');
            
            if(type === 'login') {
                tabLogin.classList.add('active');
                tabRegister.classList.remove('active');
                loginForm.classList.add('active');
                registerForm.classList.remove('active');
            } else {
                tabRegister.classList.add('active');
                tabLogin.classList.remove('active');
                registerForm.classList.add('active');
                loginForm.classList.remove('active');
            }
        }

        async function handleRegister(e) {
            e.preventDefault();
            const username = document.getElementById('regUser').value;
            const password = document.getElementById('regPass').value;

            try {
                const res = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error);

                alert("¡Cuenta creada con éxito! Ya puedes iniciar sesión.");
                document.getElementById('registerForm').reset();
                switchTab('login');
            } catch (err) {
                alert("❌ ERROR: " + err.message);
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('loginUser').value;
            const password = document.getElementById('loginPass').value;

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error);

                localStorage.setItem('currentUser', JSON.stringify(data.user));
                
                // Redirección según rol
                if (data.user.role === 'admin') {
                    window.location.href = 'dashboard-admin.html';
                } else {
                    window.location.href = 'dashboard-user.html';
                }
            } catch (err) {
                alert("❌ ERROR: " + err.message);
            }
        }
    </script>
</body>
</html>
