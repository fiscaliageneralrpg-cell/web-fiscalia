<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Institucional - Fiscalía General de la Nación</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --blue-dark: #003366; --blue-light: #1d70b8; --bg-apple: #f5f5f7;
            --text-dark: #1d1d1f; --text-muted: #86868b; --white: #ffffff; --radius: 14px;            
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        html { -webkit-text-size-adjust: 100%; }
        body { background-color: var(--bg-apple); color: var(--text-dark); padding-top: 80px; min-height: 100vh; display: flex; flex-direction: column; width: 100%; overflow-x: hidden; }
        
        .navbar { background-color: rgba(0, 51, 102, 0.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); position: fixed; top: 0; width: 100%; z-index: 1000; border-bottom: 1px solid rgba(255, 255, 255, 0.1); }
        .nav-container { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; height: 54px; padding: 0 20px; gap: 12px; }
        .logo { display: flex; align-items: center; gap: 12px; cursor: pointer; min-width: 0; flex-shrink: 1; }
        .logo-img { height: 36px; flex-shrink: 0; border-radius: 4px; background-color: rgba(255, 255, 255, 0.9); padding: 2px; }
        .logo-text { min-width: 0; overflow: hidden; }
        .logo-text strong { color: var(--white); font-size: 15px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .logo-text span { font-size: 9px; display: block; color: #cbd5e1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .nav-menu { display: flex; list-style: none; gap: 28px; }
        .nav-menu a { color: #cbd5e1; text-decoration: none; font-size: 14px; padding: 4px 0; white-space: nowrap; }
        .nav-menu a:hover, .nav-menu a.active { color: #38bdf8; }
        .nav-actions { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
        .btn-login { background-color: rgba(255, 255, 255, 0.2); color: var(--white); padding: 6px 16px; border-radius: 20px; text-decoration: none; font-size: 13px; font-weight: 500; border: 1px solid rgba(255,255,255,0.3); white-space: nowrap; flex-shrink: 0; }

        .nav-toggle { display: none; background: none; border: none; color: var(--white); font-size: 20px; cursor: pointer; padding: 6px 8px; line-height: 1; border-radius: 6px; }
        .nav-toggle:active { background: rgba(255,255,255,0.1); }

        .auth-container { max-width: 420px; width: 100%; margin: auto; padding: 20px; animation: fadeIn 0.5s ease; }
        .auth-card { background: var(--white); padding: 40px 35px; border-radius: var(--radius); box-shadow: 0 10px 30px rgba(0,0,0,0.04); border: 1px solid rgba(0,0,0,0.02); text-align: center; }
        .auth-logo { height: 60px; margin-bottom: 20px; }
        .auth-card h2 { font-size: clamp(20px, 5vw, 24px); color: var(--blue-dark); font-weight: 700; margin-bottom: 8px; }
        .auth-card p { color: var(--text-muted); font-size: 14px; margin-bottom: 30px; }

        .auth-tabs { display: flex; background: #e8e8ed; padding: 4px; border-radius: 10px; margin-bottom: 25px; }
        .tab-btn { flex: 1; border: none; background: none; padding: 8px; font-size: 14px; font-weight: 600; color: var(--text-muted); border-radius: 8px; cursor: pointer; transition: all 0.2s ease; }
        .tab-btn.active { background: var(--white); color: var(--blue-dark); box-shadow: 0 2px 6px rgba(0,0,0,0.1); }

        .auth-form { display: none; text-align: left; }
        .auth-form.active { display: block; }
        
        .input-group { margin-bottom: 18px; position: relative; }
        .input-group i { position: absolute; left: 15px; top: 38px; color: #a1a1a6; font-size: 16px; }
        .input-group label { display: block; font-size: 12px; font-weight: 600; color: var(--text-dark); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
        .input-group input { width: 100%; padding: 12px 16px 12px 42px; border-radius: 10px; border: 1px solid #d2d2d7; background: #f5f5f7; font-size: 15px; transition: all 0.2s ease; outline: none; }
        .input-group input:focus { border-color: var(--blue-light); background: var(--white); box-shadow: 0 0 0 4px rgba(29, 112, 184, 0.1); }

        .btn-submit { width: 100%; background: linear-gradient(135deg, var(--blue-dark), var(--blue-light)); color: var(--white); border: none; padding: 14px; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 10px; transition: all 0.2s ease; box-shadow: 0 4px 12px rgba(29, 112, 184, 0.2); }
        .btn-submit:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(29, 112, 184, 0.3); }

        footer { text-align: center; padding: 30px 20px; color: var(--text-muted); font-size: 13px; margin-top: auto; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* =========================================================
           RESPONSIVE
           Breakpoints: 1024px (tablet/laptop chico), 768px (menú
           hamburguesa), 600px (móvil grande), 420px (móvil estándar),
           340px (móvil muy pequeño), hover:none (pantallas táctiles)
           ========================================================= */

        /* ----- Tablet / pantallas medianas ----- */
        @media (max-width: 1024px) {
            .auth-container { max-width: 400px; }
        }

        /* ----- Activación del menú hamburguesa ----- */
        @media (max-width: 768px) {
            .nav-container { padding: 0 16px; }
            .nav-toggle { display: inline-flex; align-items: center; justify-content: center; }

            .nav-menu {
                position: fixed; top: 54px; left: 0; right: 0;
                background-color: rgba(0, 51, 102, 0.97);
                backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
                flex-direction: column; align-items: stretch; gap: 0;
                max-height: 0; overflow: hidden;
                transition: max-height 0.3s ease;
                border-bottom: 1px solid rgba(255,255,255,0.1);
                box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            }
            .nav-menu.open { max-height: 320px; }
            .nav-menu li { width: 100%; }
            .nav-menu a {
                display: block; width: 100%; padding: 15px 22px;
                border-bottom: 1px solid rgba(255,255,255,0.06);
                font-size: 15px;
            }
            .nav-menu a.active { background: rgba(56, 189, 248, 0.08); }

            .logo-text span { display: none; }
            .logo-text strong { font-size: 14px; }
        }

        /* ----- Móviles grandes ----- */
        @media (max-width: 600px) {
            body { padding-top: 64px; }
            .auth-container { padding: 16px; }
            .auth-card { padding: 32px 26px; }
            .auth-logo { height: 50px; margin-bottom: 16px; }
            .auth-card h2 { margin-bottom: 6px; }
            .auth-card p { margin-bottom: 24px; }
            .input-group i { top: 37px; }
        }

        /* ----- Móviles estándar ----- */
        @media (max-width: 420px) {
            .navbar { height: 56px; }
            .nav-container { height: 56px; padding: 0 12px; gap: 8px; }
            .logo { gap: 8px; }
            .logo-img { height: 30px; }
            .logo-text strong { font-size: 13px; }
            .btn-login { padding: 5px 12px; font-size: 12px; }
            .nav-toggle { font-size: 18px; padding: 5px 7px; }

            body { padding-top: 56px; }
            .auth-container { padding: 12px; }
            .auth-card { padding: 26px 18px; border-radius: 12px; }
            .auth-tabs { margin-bottom: 20px; }
            .tab-btn { font-size: 13px; padding: 7px; }
            .input-group { margin-bottom: 15px; }
            .input-group input { padding: 11px 14px 11px 40px; font-size: 14px; }
            .input-group i { left: 13px; top: 36px; font-size: 14px; }
            .btn-submit { padding: 12px; font-size: 14px; }
        }

        /* ----- Pantallas muy pequeñas (ej. iPhone SE) ----- */
        @media (max-width: 340px) {
            .nav-actions { gap: 6px; }
            .btn-login { padding: 4px 10px; font-size: 11px; }
            .logo-text strong { font-size: 12px; }
            .auth-card { padding: 22px 14px; }
            .auth-logo { height: 44px; }
            .auth-card h2 { font-size: 18px; }
            .tab-btn { font-size: 12px; padding: 6px; }
        }

        /* ----- Pantallas táctiles: hover deshabilitado, feedback al tocar ----- */
        @media (hover: none) {
            .btn-submit:hover { transform: none; box-shadow: 0 4px 12px rgba(29, 112, 184, 0.2); }
            .btn-submit:active { transform: scale(0.98); }
            .tab-btn:active { opacity: 0.8; }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="nav-container">
            <div class="logo" onclick="window.location.href='/index.html'">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSXBKuX8mWSlLgU5WOYx5ODP9N8QM5debq5wTdzLVi4fFWk2M8IQsowaFI&s=10" class="logo-img">
                <div class="logo-text"><strong>FISCALÍA</strong><span>GENERAL DE LA NACIÓN</span></div>
            </div>
            <ul class="nav-menu" id="navMenu">
                <li><a href="/index.html">Inicio</a></li>
                <li><a href="/buscados.html">Buscados</a></li>
                <li><a href="/noticias.html">Noticias</a></li>
            </ul>
            <div class="nav-actions">
                <a href="/iniciar-sesion.html" class="btn-login">Acceder</a>
                <button class="nav-toggle" id="navToggle" aria-label="Abrir menú" aria-expanded="false">
                    <i class="fa-solid fa-bars"></i>
                </button>
            </div>
        </div>
    </nav>

    <div class="auth-container">
        <div class="auth-card">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSXBKuX8mWSlLgU5WOYx5ODP9N8QM5debq5wTdzLVi4fFWk2M8IQsowaFI&s=10" class="auth-logo" alt="Fiscalía Escudo">
            <h2>Portal de Validación</h2>
            <p>Sectores y servicios de la Fiscalía General.</p>

            <div class="auth-tabs">
                <button id="tab-login" class="tab-btn active" onclick="switchTab('login')">Iniciar Sesión</button>
                <button id="tab-register" class="tab-btn" onclick="switchTab('register')">Crear Cuenta</button>
            </div>

            <form id="loginForm" class="auth-form active" onsubmit="handleLogin(event)">
                <div class="input-group">
                    <label>Usuario / Correo</label>
                    <i class="fa-solid fa-user"></i>
                    <input type="text" id="loginUser" placeholder="Tu correo o usuario" required>
                </div>
                <div class="input-group">
                    <label>Contraseña</label>
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="loginPass" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-submit">Ingresar al Sistema</button>
            </form>

            <form id="registerForm" class="auth-form" onsubmit="handleRegister(event)">
                <div class="input-group">
                    <label>Usuario / Correo</label>
                    <i class="fa-solid fa-user"></i>
                    <input type="text" id="regUser" placeholder="Crea tu usuario o correo" required>
                </div>
                <div class="input-group">
                    <label>Contraseña</label>
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="regPass" placeholder="Crea tu contraseña" required>
                </div>
                <button type="submit" class="btn-submit">Registrar Cuenta</button>
            </form>

        </div>
    </div>

    <footer>
        <p>&copy; 2026 Fiscalía General de la Nación - Servidor RP Colombia.</p>
    </footer>

    <script>
        const navToggle = document.getElementById('navToggle');
        const navMenu = document.getElementById('navMenu');

        navToggle.addEventListener('click', () => {
            const isOpen = navMenu.classList.toggle('open');
            navToggle.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
        });

        navMenu.querySelectorAll('a').forEach(link => {
            link.addEventListener('click', () => {
                navMenu.classList.remove('open');
                navToggle.setAttribute('aria-expanded', 'false');
            });
        });
        window.addEventListener('resize', () => {
            if (window.innerWidth > 768) {
                navMenu.classList.remove('open');
                navToggle.setAttribute('aria-expanded', 'false');
            }
        });

        function switchTab(type) {
            const tabLogin = document.getElementById('tab-login');
            const tabRegister = document.getElementById('tab-register');
            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');
            
            if(type === 'login') {
                tabLogin.classList.add('active');
                tabRegister.classList.remove('active');
                loginForm.classList.add('active');
                registerForm.classList.remove('active');
            } else {
                tabRegister.classList.add('active');
                tabLogin.classList.remove('active');
                registerForm.classList.add('active');
                loginForm.classList.remove('active');
            }
        }

        async function handleRegister(e) {
            e.preventDefault();
            const username = document.getElementById('regUser').value;
            const password = document.getElementById('regPass').value;

            try {
                const res = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error);

                alert("¡Cuenta creada con éxito! Ya puedes iniciar sesión.");
                document.getElementById('registerForm').reset();
                switchTab('login');
            } catch (err) {
                alert("❌ ERROR: " + err.message);
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('loginUser').value;
            const password = document.getElementById('loginPass').value;

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error);

                localStorage.setItem('currentUser', JSON.stringify(data.user));
                
                // Redirección según rol
                if (data.user.role === 'admin') {
                    window.location.href = '/dashboard-admin.html';
                } else {
                    window.location.href = '/dashboard-user.html';
                }
            } catch (err) {
                alert("❌ ERROR: " + err.message);
            }
        }
    </script>
</body>
</html>
