<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso — Base de datos Colombia RPG</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --black:  #0a0a0f; --surface: #111118; --panel: #16161f;
            --border: #2a2a3a; --red: #c0392b; --red-glow: rgba(192,57,43,0.25);
            --gold: #f0c040; --text: #e8e8f0; --muted: #6b6b80;
            --mono: 'Courier New', monospace; --radius: 6px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--black); color: var(--text);
            padding-top: 54px; min-height: 100vh;
            display: flex; flex-direction: column; overflow-x: hidden;
        }

        /* NAVBAR */
        .navbar { background-color: rgba(10,10,15,0.92); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); position: fixed; top: 0; width: 100%; z-index: 1000; border-bottom: 1px solid var(--border); }
        .nav-container { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; height: 54px; padding: 0 20px; }
        .logo { display: flex; align-items: center; gap: 12px; cursor: pointer; min-width: 0; }
        .logo-badge { width: 36px; height: 36px; flex-shrink: 0; background: linear-gradient(135deg, var(--red), #8b1a12); border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 16px; color: var(--gold); }
        .logo-text strong { color: var(--text); font-size: 13px; font-family: var(--mono); letter-spacing: 1px; display: block; white-space: nowrap; }
        .logo-text span { font-size: 9px; display: block; color: var(--muted); font-family: var(--mono); white-space: nowrap; }
        .nav-menu { display: flex; list-style: none; gap: 24px; }
        .nav-menu a { color: var(--muted); text-decoration: none; font-size: 12px; font-family: var(--mono); letter-spacing: 1px; text-transform: uppercase; transition: color 0.2s; }
        .nav-menu a:hover, .nav-menu a.active { color: var(--gold); }
        .btn-login { background: transparent; border: 1px solid var(--red); color: var(--red); padding: 6px 16px; border-radius: var(--radius); text-decoration: none; font-size: 11px; font-weight: 600; font-family: var(--mono); letter-spacing: 1px; text-transform: uppercase; transition: all 0.2s; white-space: nowrap; }
        .btn-login:hover { background-color: var(--red); color: var(--text); }
        .nav-toggle { display: none; background: none; border: none; color: var(--text); font-size: 18px; cursor: pointer; padding: 6px 8px; }

        /* AUTH */
        .auth-wrapper { flex: 1; display: flex; align-items: center; justify-content: center; padding: 48px 20px; }
        .auth-card {
            background: var(--panel); border: 1px solid var(--border);
            border-radius: 20px; padding: 44px 40px;
            width: 100%; max-width: 400px;
        }
        .auth-header { text-align: center; margin-bottom: 32px; }
        .auth-icon {
            width: 56px; height: 56px; margin: 0 auto 20px;
            background: rgba(192,57,43,0.12); border: 1px solid rgba(192,57,43,0.2);
            border-radius: 14px; display: flex; align-items: center; justify-content: center;
            font-size: 22px; color: var(--red);
        }
        .auth-header h2 { font-size: 22px; font-weight: 700; letter-spacing: -0.3px; margin-bottom: 6px; }
        .auth-header p { color: var(--muted); font-size: 14px; }

        /* TABS */
        .auth-tabs { display: flex; background: rgba(255,255,255,0.04); border: 1px solid var(--border); padding: 3px; border-radius: 10px; margin-bottom: 28px; }
        .tab-btn { flex: 1; border: none; background: none; padding: 8px; font-size: 13px; font-weight: 600; color: var(--muted); border-radius: 8px; cursor: pointer; transition: all 0.2s; font-family: inherit; }
        .tab-btn.active { background: var(--red); color: #fff; }

        /* FORM */
        .auth-form { display: none; }
        .auth-form.active { display: block; }
        .input-group { margin-bottom: 16px; }
        .input-group label { display: block; font-size: 11px; font-weight: 600; color: var(--muted); margin-bottom: 7px; letter-spacing: 0.5px; text-transform: uppercase; font-family: var(--mono); }
        .input-wrap { position: relative; }
        .input-wrap i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 14px; pointer-events: none; }
        .input-wrap input {
            width: 100%; padding: 12px 14px 12px 40px;
            background: rgba(255,255,255,0.04); border: 1px solid var(--border);
            border-radius: 10px; color: var(--text); font-size: 15px;
            font-family: inherit; outline: none; transition: border-color 0.2s;
        }
        .input-wrap input::placeholder { color: var(--muted); }
        .input-wrap input:focus { border-color: var(--red); }

        .btn-submit {
            width: 100%; background: var(--red); color: #fff;
            border: none; padding: 14px; border-radius: 980px;
            font-size: 15px; font-weight: 600; cursor: pointer;
            margin-top: 8px; transition: all 0.2s; font-family: inherit;
        }
        .btn-submit:hover { background: #a93224; transform: scale(1.02); }

        footer { text-align: center; padding: 28px 20px; color: rgba(255,255,255,0.2); font-size: 13px; }

        @media (max-width: 768px) {
            .nav-menu { position: fixed; top: 54px; left: 0; right: 0; background: rgba(10,10,15,0.97); flex-direction: column; gap: 0; max-height: 0; overflow: hidden; transition: max-height 0.3s ease; border-bottom: 1px solid var(--border); }
            .nav-menu.open { max-height: 300px; }
            .nav-menu li { width: 100%; }
            .nav-menu a { display: block; padding: 14px 20px; border-bottom: 1px solid var(--border); }
            .nav-toggle { display: block; }
            .logo-text span { display: none; }
        }
        @media (max-width: 480px) {
            .auth-card { padding: 32px 22px; }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo" onclick="window.location.href='/index.html'">
                <div class="logo-badge"><i class="fa-solid fa-database"></i></div>
                <div class="logo-text">
                    <strong>BASE DE DATOS COLOMBIA RPG</strong>
                    <span>SISTEMA INTEGRADO CRIMINAL // ACCESO RESTRINGIDO</span>
                </div>
            </div>
            <ul class="nav-menu" id="navMenu">
                <li><a href="/index.html">Inicio</a></li>
                <li><a href="/buscados.html">Buscados</a></li>
                <li><a href="/noticias.html">Noticias</a></li>
            </ul>
            <div style="display:flex;align-items:center;gap:10px;">
                <a href="/iniciar-sesion.html" class="btn-login active">Acceder</a>
                <button class="nav-toggle" id="navToggle"><i class="fa-solid fa-bars"></i></button>
            </div>
        </div>
    </nav>

    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-icon"><i class="fa-solid fa-database"></i></div>
                <h2>Portal de acceso</h2>
                <p>Sectores y servicios de la Fiscalía General</p>
            </div>

            <div class="auth-tabs">
                <button id="tab-login" class="tab-btn active" onclick="switchTab('login')">Iniciar sesión</button>
                <button id="tab-register" class="tab-btn" onclick="switchTab('register')">Crear cuenta</button>
            </div>

            <form id="loginForm" class="auth-form active" onsubmit="handleLogin(event)">
                <div class="input-group">
                    <label>Usuario / Correo</label>
                    <div class="input-wrap">
                        <i class="fa-solid fa-user"></i>
                        <input type="text" id="loginUser" placeholder="Tu correo o usuario" required>
                    </div>
                </div>
                <div class="input-group">
                    <label>Contraseña</label>
                    <div class="input-wrap">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="loginPass" placeholder="••••••••" required>
                    </div>
                </div>
                <button type="submit" class="btn-submit">Ingresar al sistema</button>
            </form>

            <form id="registerForm" class="auth-form" onsubmit="handleRegister(event)">
                <div class="input-group">
                    <label>Usuario / Correo</label>
                    <div class="input-wrap">
                        <i class="fa-solid fa-user"></i>
                        <input type="text" id="regUser" placeholder="Crea tu usuario o correo" required>
                    </div>
                </div>
                <div class="input-group">
                    <label>Contraseña</label>
                    <div class="input-wrap">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="regPass" placeholder="Crea tu contraseña" required>
                    </div>
                </div>
                <button type="submit" class="btn-submit">Registrar cuenta</button>
            </form>
        </div>
    </div>

    <footer><p>Copyright &copy; 2026 Base de datos Colombia RPG</p></footer>

    <script>
        const navToggle = document.getElementById('navToggle');
        const navMenu = document.getElementById('navMenu');
        navToggle.addEventListener('click', () => navMenu.classList.toggle('open'));
        window.addEventListener('resize', () => { if(window.innerWidth > 768) navMenu.classList.remove('open'); });

        function switchTab(type) {
            document.getElementById('tab-login').classList.toggle('active', type === 'login');
            document.getElementById('tab-register').classList.toggle('active', type === 'register');
            document.getElementById('loginForm').classList.toggle('active', type === 'login');
            document.getElementById('registerForm').classList.toggle('active', type === 'register');
        }

        async function handleRegister(e) {
            e.preventDefault();
            const username = document.getElementById('regUser').value;
            const password = document.getElementById('regPass').value;
            try {
                const res = await fetch('/api/register', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username, password }) });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error);
                alert("¡Cuenta creada! Ya puedes iniciar sesión.");
                document.getElementById('registerForm').reset();
                switchTab('login');
            } catch (err) { alert("Error: " + err.message); }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('loginUser').value;
            const password = document.getElementById('loginPass').value;
            try {
                const res = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username, password }) });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error);
                localStorage.setItem('currentUser', JSON.stringify(data.user));
                window.location.href = data.user.role === 'admin' ? '/dashboard-admin.html' : '/dashboard-user.html';
            } catch (err) { alert("Error: " + err.message); }
        }
    </script>
</body>
</html>
