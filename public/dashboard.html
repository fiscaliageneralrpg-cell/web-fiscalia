<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - Fiscalía</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        body { background-color: #f4f6f9; font-family: 'Segoe UI', sans-serif; }
        .sidebar { background-color: #0b1d3a; min-height: 100vh; color: white; }
        .sidebar a { color: #cfd8dc; text-decoration: none; display: block; padding: 12px 20px; transition: 0.2s; }
        .sidebar a:hover, .sidebar a.active { background-color: #1a365d; color: white; border-left: 4px solid #0d6efd; }
        .card-custom { border: none; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.04); background: white; margin-bottom: 25px; }
        .table th { background-color: #f8f9fa; color: #495057; font-weight: 600; }
        .btn-action { padding: 4px 10px; font-size: 0.85rem; border-radius: 6px; }
    </style>
</head>
<body>

    <div class="container-fluid">
        <div class="row">
            <div class="col-md-3 col-lg-2 p-0 sidebar shadow">
                <div class="p-3 text-center border-bottom border-secondary">
                    <h5 class="fw-bold m-0"><i class="fa-solid fa-user-gear me-2 text-primary"></i>ADMINISTRACIÓN</h5>
                </div>
                <div class="py-3">
                    <a href="#" class="active"><i class="fa-solid fa-chart-line me-2"></i>Inicio / Control</a>
                    <a href="/noticias.html" target="_blank"><i class="fa-solid fa-newspaper me-2"></i>Ver Noticias</a>
                    <a href="/buscados.html" target="_blank"><i class="fa-solid fa-skull me-2"></i>Ver Buscados</a>
                </div>
            </div>

            <div class="col-md-9 col-lg-10 p-4">
                <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
                    <h2 class="fw-bold text-dark">Sistema Central de la Fiscalía General</h2>
                    <span class="badge bg-success p-2 fs-6"><i class="fa-solid fa-circle-check me-1"></i>Servidor Conectado</span>
                </div>

                <div class="card card-custom p-4">
                    <h5 class="fw-bold text-dark mb-3"><i class="fa-solid fa-users me-2 text-primary"></i>Cuentas Registradas en el Sistema</h5>
                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead>
                                <tr>
                                    <th>Usuario / Correo</th>
                                    <th>Estado</th>
                                    <th>Contraseña (Cifrada)</th>
                                    <th class="text-end">Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="tabla-usuarios">
                                </tbody>
                        </table>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6">
                        <div class="card card-custom p-4">
                            <h5 class="fw-bold text-dark mb-3"><i class="fa-solid fa-bullhorn me-2 text-primary"></i>Publicar Noticia Oficial</h5>
                            <div class="input-group mb-3">
                                <input type="text" id="input-noticia" class="form-control" placeholder="Escribe el titular de la noticia...">
                                <button class="btn btn-primary" onclick="agregarNoticia()"><i class="fa-solid fa-plus"></i></button>
                            </div>
                            <ul class="list-group" id="lista-noticias"></ul>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <div class="card card-custom p-4">
                            <h5 class="fw-bold text-dark mb-3"><i class="fa-solid fa-user-ninja me-2 text-danger"></i>Añadir Orden de Captura</h5>
                            <div class="input-group mb-3">
                                <input type="text" id="input-buscado" class="form-control" placeholder="Nombre completo del requerido...">
                                <button class="btn btn-danger" onclick="agregarBuscado()"><i class="fa-solid fa-user-plus"></i></button>
                            </div>
                            <ul class="list-group" id="lista-buscados"></ul>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script>
        async function cargarDatosDashboard() {
            try {
                const response = await fetch('/api/admin/data');
                const data = await response.json();

                // 1. Renderizar Usuarios
                const tUsuarios = document.getElementById('tabla-usuarios');
                tUsuarios.innerHTML = '';
                data.users.forEach(user => {
                    const esPendiente = user.status === 'pendiente';
                    tUsuarios.innerHTML += `
                        <tr>
                            <td class="fw-bold">${user.username}</td>
                            <td><span class="badge ${esPendiente ? 'bg-warning text-dark' : 'bg-success'}">${user.status.toUpperCase()}</span></td>
                            <td><code class="text-muted small">${user.password.substring(0, 25)}...</code></td>
                            <td class="text-end">
                                ${esPendiente ? `<button class="btn btn-success btn-action me-1" onclick="aceptarUsuario('${user.username}')"><i class="fa-solid fa-check"></i> Aceptar</button>` : ''}
                                <button class="btn btn-outline-danger btn-action" onclick="eliminarUsuario('${user.username}')"><i class="fa-solid fa-trash"></i> Eliminar</button>
                            </td>
                        </tr>
                    `;
                });

                // 2. Renderizar Noticias
                const lNoticias = document.getElementById('lista-noticias');
                lNoticias.innerHTML = '';
                data.noticias.forEach(n => {
                    lNoticias.innerHTML += `
                        <li class="list-group-item d-flex justify-content-between align-items-center">
                            <span><i class="fa-regular fa-file-lines me-2 text-muted"></i>${n.titular}</span>
                            <button class="btn btn-link text-danger p-0" onclick="eliminarNoticia(${n.id})"><i class="fa-solid fa-trash-can"></i></button>
                        </li>
                    `;
                });

                // 3. Renderizar Buscados
                const lBuscados = document.getElementById('lista-buscados');
                lBuscados.innerHTML = '';
                data.buscados.forEach(b => {
                    lBuscados.innerHTML += `
                        <li class="list-group-item d-flex justify-content-between align-items-center border-start border-danger border-3">
                            <span><i class="fa-solid fa-skull-crossbones me-2 text-danger"></i><strong>${b.nombre}</strong></span>
                            <button class="btn btn-link text-danger p-0" onclick="eliminarBuscado(${b.id})"><i class="fa-solid fa-trash-can"></i></button>
                        </li>
                    `;
                });

            } catch (err) { console.error("Error al cargar datos:", err); }
        }

        // FUNCIONES DE ACCIONES API
        async function gestionarPost(url, body) {
            await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            cargarDatosDashboard();
        }

        function aceptarUsuario(username) { gestionarPost('/api/admin/accept-user', { username }); }
        function eliminarUsuario(username) { if(confirm("¿Eliminar cuenta?")) gestionarPost('/api/admin/delete-user', { username }); }
        
        function agregarNoticia() { 
            const titular = document.getElementById('input-noticia').value;
            if(titular) { gestionarPost('/api/admin/add-noticia', { titular }); document.getElementById('input-noticia').value = ''; }
        }
        function eliminarNoticia(id) { gestionarPost('/api/admin/delete-noticia', { id }); }

        function agregarBuscado() { 
            const nombre = document.getElementById('input-buscado').value;
            if(nombre) { gestionarPost('/api/admin/add-buscado', { nombre }); document.getElementById('input-buscado').value = ''; }
        }
        function eliminarBuscado(id) { gestionarPost('/api/admin/delete-buscado', { id }); }

        window.onload = cargarDatosDashboard;
    </script>
</body>
</html>
