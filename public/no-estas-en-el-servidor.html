<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>No estás en el servidor | Medellín RP</title>
  <style>
    :root{--navy:#06141f;--blue:#0c7890;--cyan:#42d8d0;--cream:#f4efe3;--muted:#a9bac6;--line:#42d8d044}
    *{box-sizing:border-box}
    body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px;color:var(--cream);background:linear-gradient(135deg,#06141f,#0a3140);font-family:Inter,system-ui,sans-serif}
    .card{position:relative;width:min(620px,100%);overflow:hidden;padding:42px 34px;text-align:center;border:1px solid var(--line);border-radius:28px;background:linear-gradient(145deg,#102b42f5,#071b2bf5);box-shadow:0 25px 70px #0008,inset 0 1px #ffffff12}
    .card:after{position:absolute;right:-120px;bottom:-180px;width:360px;height:360px;border:1px solid #42d8d033;border-radius:50%;content:""}
    .icon{position:relative;z-index:1;display:grid;width:82px;height:82px;margin:0 auto 22px;place-items:center;border:1px solid #42d8d066;border-radius:24px;background:#42d8d018;color:var(--cyan);font-size:44px}
    .eyebrow{position:relative;z-index:1;color:var(--cyan);font-size:11px;font-weight:900;letter-spacing:.16em;text-transform:uppercase}
    h1{position:relative;z-index:1;margin:12px 0;font-size:clamp(30px,6vw,52px);letter-spacing:-.06em}
    p{position:relative;z-index:1;margin:0 auto;max-width:470px;color:var(--muted);line-height:1.65}
    .actions{position:relative;z-index:1;display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:28px}
    .button{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 19px;border-radius:11px;text-decoration:none;font-weight:900}
    .primary{color:var(--navy);background:var(--cyan)}
    .secondary{border:1px solid #42d8d066;color:#c5e2e1;background:#42d8d012}
    @media(max-width:560px){.card{padding:34px 22px}.actions{flex-direction:column}.button{width:100%}}
  </style>
</head>
<body>
  <main class="card">
    <div class="icon">🚫</div>
    <div class="eyebrow">「ME:RP」Medellín RP︱ER:LC</div>
    <h1>No estás en el servidor</h1>
    <p>Tu cuenta de Discord no pertenece actualmente al servidor de Medellín RP. Únete al servidor para poder iniciar sesión y acceder al portal ciudadano.</p>
    <div class="actions">
      <a class="button primary" href="https://discord.gg/BcHQFm4Pc" target="_blank" rel="noopener">Unirme al servidor</a>
      <a class="button secondary" href="/index.html">Volver a iniciar sesión</a>
    </div>
  </main>
</body>
</html>
