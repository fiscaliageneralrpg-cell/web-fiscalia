<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevHub | Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* --- CORE SYSTEM --- */
        :root {
            --sidebar-width: 280px;
            --apple-blue: #0071e3;
            --bg-light: #f5f5f7;
            --glass-bg: rgba(255, 255, 255, 0.7);
            --text-dark: #1d1d1f;
            --text-gray: #86868b;
            --border-color: rgba(0,0,0,0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', -apple-system, sans-serif; }

        body {
            background-color: var(--bg-light);
            display: flex;
            height: 100vh;
            overflow: hidden;
            color: var(--text-dark);
        }

        /* --- SIDEBAR DESIGN (DISCORD STYLE) --- */
        .sidebar {
            width: var(--sidebar-width);
            background: #fff;
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 30px 15px;
            z-index: 10;
        }

        .brand {
            padding: 0 15px;
            margin-bottom: 40px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-logo {
            width: 35px; height: 35px;
            background: var(--apple-blue);
            border-radius: 10px;
            display: flex; justify-content: center; align-items: center;
            color: white; font-weight: 700; font-size: 20px;
        }

        .brand-name { font-size: 22px; font-weight: 700; letter-spacing: -1px; }

        .nav-section { margin-bottom: 30px; }
        .nav-label {
            font-size: 11px; font-weight: 700; color: var(--text-gray);
            text-transform: uppercase; letter-spacing: 1px;
            margin-bottom: 12px; padding-left: 15px;
        }

        .nav-link {
            display: flex; align-items: center; gap: 12px;
            padding: 14px 15px; border-radius: 14px;
            text-decoration: none; color: #424245;
            font-weight: 500; font-size: 15px;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .nav-link:hover { background: rgba(0,0,0,0.04); transform: translateX(3px); }
        .nav-link.active { background: var(--apple-blue); color: white; box-shadow: 0 10px 20px rgba(0,113,227,0.15); }

        /* --- MAIN CONTENT AREA --- */
        .main-container {
            flex: 1;
            padding: 40px;
            display: flex; flex-direction: column;
            background: linear-gradient(135deg, #f5f5f7 0%, #ffffff 100%);
            overflow-y: auto;
            position: relative;
        }

        .welcome-hero {
            background: white;
            padding: 60px;
            border-radius: 40px;
            border: 1px solid var(--border-color);
            box-shadow: 0 20px 40px rgba(0,0,0,0.02);
            max-width: 900px;
            margin: auto;
            text-align: center;
            animation: slideUp 0.8s ease;
        }

        @keyframes slideUp { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }

        .user-badge {
            display: inline-block;
            background: #e8f3ff;
            color: var(--apple-blue);
            padding: 8px 20px;
            border-radius: 50px;
            font-weight: 600; font-size: 13px;
            margin-bottom: 25px;
        }

        .welcome-hero h1 { font-size: 48px; font-weight: 700; margin-bottom: 15px; letter-spacing: -2px; }
        .welcome-hero p { font-size: 20px; color: var(--text-gray); line-height: 1.6; margin-bottom: 35px; }

        .quick-actions {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            max-width: 500px;
            margin: 0 auto;
        }

        .action-card {
            background: #fbfbfd;
            padding: 25px;
            border-radius: 24px;
            border: 1px solid var(--border-color);
            cursor: pointer;
            transition: 0.3s;
        }

        .action-card:hover { border-color: var(--apple-blue); transform: translateY(-5px); }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="brand">
            <div class="brand-logo">D</div>
            <span class="brand-name">DevHub</span>
        </div>

        <div class="nav-section">
            <p class="nav-label">Navegación</p>
            <a href="dashboard.html" class="nav-link active">🏠 Dashboard</a>
            <a href="chat.html" class="nav-link">💬 Chat & Amigos</a>
            <a href="foro.html" class="nav-link">📚 Foro Global</a>
        </div>

        <div class="nav-section">
            <p class="nav-label">Comunidad</p>
            <a href="#" class="nav-link">👤 Perfil</a>
            <a href="#" class="nav-link">⚙️ Ajustes</a>
        </div>

        <div style="margin-top: auto; padding-top: 20px; border-top: 1px solid var(--border-color);">
            <a href="/" onclick="localStorage.clear()" class="nav-link" style="color: #ff3b30;">🚪 Salir</a>
        </div>
    </aside>

    <main class="main-container">
        <div class="welcome-hero">
            <span class="user-badge">Developer ID Verificado</span>
            <h1 id="userTitle">Bienvenido, Dev</h1>
            <p>Tu ecosistema de desarrollo está listo. Conecta con otros programadores, comparte código y construye el futuro.</p>
            
            <div class="quick-actions">
                <div class="action-card" onclick="location.href='chat.html'">
                    <span style="font-size: 30px;">💬</span>
                    <h3 style="margin-top:10px;">Ir al Chat</h3>
                </div>
                <div class="action-card" onclick="location.href='foro.html'">
                    <span style="font-size: 30px;">📚</span>
                    <h3 style="margin-top:10px;">Ver Foro</h3>
                </div>
            </div>
        </div>
    </main>

    <script>
        const user = localStorage.getItem('username') || 'Invitado';
        document.getElementById('userTitle').innerText = `Bienvenido, ${user}`;
    </script>
</body>
</html>
