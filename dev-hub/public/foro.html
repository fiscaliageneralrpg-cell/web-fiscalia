<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>DevHub | Foro</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: #f5f5f7; display: flex; justify-content: center; align-items: center; height: 100vh; text-align: center; }

        .coming-soon-card {
            background: white;
            padding: 80px 40px;
            border-radius: 40px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.05);
            max-width: 600px;
            animation: bounceIn 0.8s ease;
        }

        @keyframes bounceIn {
            0% { transform: scale(0.8); opacity: 0; }
            70% { transform: scale(1.05); }
            100% { transform: scale(1); opacity: 1; }
        }

        .badge {
            background: #0071e3;
            color: white;
            padding: 6px 15px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 12px;
            display: inline-block;
            margin-bottom: 20px;
        }

        h1 { font-size: 42px; font-weight: 700; margin-bottom: 20px; color: #1d1d1f; }
        p { font-size: 18px; color: #86868b; line-height: 1.5; margin-bottom: 40px; }

        .btn-back {
            display: inline-block;
            padding: 15px 30px;
            background: #1d1d1f;
            color: white;
            text-decoration: none;
            border-radius: 14px;
            font-weight: 600;
            transition: 0.3s;
        }

        .btn-back:hover { background: #424245; transform: scale(1.05); }
    </style>
</head>
<body>

    <div class="coming-soon-card">
        <span class="badge">PROYECTO EN CURSO</span>
        <h1>El Foro de DevHub</h1>
        <p>Estamos construyendo un espacio para que puedas compartir tus snippets de código y resolver dudas con otros desarrolladores de la comunidad.</p>
        
        <div style="font-size: 40px; margin-bottom: 40px;">⏳ 📚 🚀</div>

        <a href="dashboard.html" class="btn-back">Regresar al Dashboard</a>
    </div>

</body>
</html>
