<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevHub | Iniciar Sesión</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* --- CSS EXTENSO ESTILO APPLE --- */
        :root {
            --bg-color: #f5f5f7;
            --card-bg: rgba(255, 255, 255, 0.72);
            --text-main: #1d1d1f;
            --text-sub: #86868b;
            --apple-blue: #0071e3;
            --apple-red: #ff3b30;
            --apple-green: #34c759;
            --border-light: rgba(210, 210, 215, 0.6);
        }

        * {
            margin: 0; padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(at 0% 0%, rgba(0, 113, 227, 0.05) 0px, transparent 50%),
                              radial-gradient(at 100% 100%, rgba(0, 113, 227, 0.05) 0px, transparent 50%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Contenedor con Glassmorphism */
        .login-wrapper {
            width: 100%;
            max-width: 440px;
            padding: 20px;
            perspective: 1000px;
        }

        .login-card {
            background: var(--card-bg);
            backdrop-filter: blur(30px) saturate(180%);
            -webkit-backdrop-filter: blur(30px) saturate(180%);
            border-radius: 40px;
            padding: 50px 40px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.08);
            text-align: center;
            transform: translateZ(0);
            transition: transform 0.4s cubic-bezier(0.2, 0, 0.2, 1);
            animation: cardReveal 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes cardReveal {
            from { opacity: 0; transform: translateY(30px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .logo-icon {
            font-size: 48px;
            font-weight: 700;
            letter-spacing: -2px;
            color: var(--text-main);
            margin-bottom: 12px;
            display: inline-block;
        }

        .title { font-size: 28px; font-weight: 600; color: var(--text-main); margin-bottom: 8px; }
        .subtitle { font-size: 17px; color: var(--text-sub); margin-bottom: 35px; }

        /* Estilos de Alerta Expandidos */
        .status-msg {
            padding: 14px 18px;
            border-radius: 16px;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 25px;
            display: none;
            text-align: left;
            line-height: 1.4;
            animation: alertIn 0.3s ease;
        }

        @keyframes alertIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }

        .msg-error { background: rgba(255, 59, 48, 0.1); color: var(--apple-red); border: 1px solid rgba(255, 59, 48, 0.2); }
        .msg-success { background: rgba(52, 199, 89, 0.1); color: var(--apple-green); border: 1px solid rgba(52, 199, 89, 0.2); }

        /* Inputs Premium */
        .form-group { position: relative; margin-bottom: 18px; text-align: left; }
        
        input {
            width: 100%;
            padding: 18px 20px;
            border-radius: 16px;
            border: 1px solid var(--border-light);
            background: rgba(255, 255, 255, 0.8);
            font-size: 16px;
            color: var(--text-main);
            outline: none;
            transition: all 0.2s ease;
        }

        input:focus {
            border-color: var(--apple-blue);
            background: #fff;
            box-shadow: 0 0 0 4px rgba(0, 113, 227, 0.1);
        }

        /* Botón Apple Pro */
        .btn-submit {
            width: 100%;
            padding: 18px;
            border-radius: 16px;
            border: none;
            background: var(--apple-blue);
            color: white;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            margin-top: 10px;
            position: relative;
            overflow: hidden;
        }

        .btn-submit:hover {
            background: #0077ed;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 113, 227, 0.2);
        }

        .btn-submit:active { transform: translateY(0); }

        .footer { margin-top: 30px; font-size: 14px; color: var(--text-sub); }
        .footer a { color: var(--apple-blue); text-decoration: none; font-weight: 500; transition: 0.2s; }
        .footer a:hover { text-decoration: underline; }

        /* Loader */
        .loader {
            width: 20px; height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%; border-top-color: #fff;
            animation: spin 0.8s linear infinite;
            display: none; margin: 0 auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="login-wrapper">
        <div class="login-card">
            <span class="logo-icon"></span>
            <h1 class="title">DevHub</h1>
            <p class="subtitle">Conéctate a la comunidad.</p>

            <div id="statusAlert" class="status-msg"></div>

            <form id="loginForm">
                <div class="form-group">
                    <input type="text" id="userInput" placeholder="Usuario o ID" required autocomplete="username">
                </div>
                <div class="form-group">
                    <input type="password" id="passInput" placeholder="Contraseña" required autocomplete="current-password">
                </div>
                
                <button type="submit" id="btnText" class="btn-submit">
                    <span id="textNormal">Continuar</span>
                    <div id="loader" class="loader"></div>
                </button>
            </form>

            <div class="footer">
                ¿Nuevo en DevHub? <a href="registrar.html">Crea tu ID ahora.</a>
            </div>
        </div>
    </div>

    <script>
        /**
         * LÓGICA DE FRONTEND - LOGIN
         * Manejo de estados de carga y validaciones del servidor.
         */
        const form = document.getElementById('loginForm');
        const alertBox = document.getElementById('statusAlert');
        const loader = document.getElementById('loader');
        const textNormal = document.getElementById('textNormal');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // UI State: Cargando
            alertBox.style.display = "none";
            loader.style.display = "block";
            textNormal.style.display = "none";

            const payload = {
                username: document.getElementById('userInput').value,
                password: document.getElementById('passInput').value
            };

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                // Manejo de códigos de respuesta del servidor
                if (response.status === 200) {
                    // ÉXITO: SECCIÓN INICIADA
                    alertBox.className = "status-msg msg-success";
                    alertBox.innerText = "✓ SECCIÓN INICIADA: Redirigiendo a tu espacio de trabajo...";
                    alertBox.style.display = "block";
                    
                    localStorage.setItem('username', data.user.username);
                    localStorage.setItem('isAuth', 'true');

                    setTimeout(() => {
                        window.location.href = "/dashboard";
                    }, 1500);

                } else if (response.status === 404) {
                    // ERROR: CUENTA NO EXISTE
                    throw new Error(data.message);
                } else if (response.status === 401) {
                    // ERROR: CLAVE INCORRECTA
                    throw new Error(data.message);
                } else {
                    throw new Error("Error desconocido. Contacta a soporte.");
                }

            } catch (err) {
                // UI State: Error
                alertBox.className = "status-msg msg-error";
                alertBox.innerText = "✕ " + err.message;
                alertBox.style.display = "block";
                loader.style.display = "none";
                textNormal.style.display = "block";
            }
        });
    </script>
</body>
</html>
